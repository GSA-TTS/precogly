countermeasures:
  # ============================================================================
  # S3 Countermeasures
  # ============================================================================
  - id: s3-block-public-access
    name: S3 Block Public Access
    description: |
      Enable S3 Block Public Access settings at account and bucket level.
      Prevents accidental public exposure regardless of bucket policies or ACLs.
    control_functions: [preventive]
    cost: low

  - id: s3-bucket-policy
    name: S3 Bucket Policy Restriction
    description: |
      Implement least-privilege bucket policies limiting access to authorized principals.
      Use conditions to restrict by VPC, IP range, or requiring MFA.
    control_functions: [preventive]
    cost: low

  - id: s3-versioning
    name: S3 Versioning
    description: |
      Enable versioning to protect against accidental or malicious deletions/modifications.
      Combined with MFA Delete for additional protection.
    control_functions: [detective]
    cost: low

  - id: s3-encryption
    name: S3 Server-Side Encryption
    description: |
      Enable SSE-S3 or SSE-KMS encryption for data at rest.
      Use bucket keys to reduce KMS costs for high-volume buckets.
    control_functions: [preventive]
    cost: low

  - id: s3-access-logging
    name: S3 Access Logging
    description: |
      Enable server access logging to track all requests to the bucket.
      Logs can be analyzed for suspicious access patterns.
    control_functions: [detective]
    cost: low

  - id: s3-mfa-delete
    name: S3 MFA Delete
    description: |
      Require MFA for object version deletion, providing additional
      protection against accidental or malicious permanent deletions.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # Lambda Countermeasures
  # ============================================================================
  - id: lambda-input-validation
    name: Lambda Input Validation
    description: |
      Validate and sanitize all input to Lambda functions.
      Use schema validation libraries and reject unexpected input.
    control_functions: [preventive]
    cost: low

  - id: lambda-least-privilege
    name: Lambda Least Privilege Role
    description: |
      Configure Lambda execution role with minimum required permissions.
      Use separate roles for each function based on actual needs.
    control_functions: [preventive]
    cost: low

  - id: lambda-vpc
    name: Lambda VPC Isolation
    description: |
      Deploy Lambda in VPC with security groups for network isolation.
      Limits blast radius and enables private resource access.
    control_functions: [preventive]
    cost: medium

  - id: lambda-secrets-manager
    name: Use Secrets Manager for Lambda
    description: |
      Store sensitive data in AWS Secrets Manager instead of environment variables.
      Enables rotation, auditing, and fine-grained access control.
    control_functions: [preventive]
    cost: medium

  - id: lambda-reserved-concurrency
    name: Lambda Reserved Concurrency
    description: |
      Set reserved concurrency limits to prevent resource exhaustion
      and control costs during traffic spikes or attacks.
    control_functions: [preventive]
    cost: low

  - id: lambda-code-signing
    name: Lambda Code Signing
    description: |
      Enable code signing to ensure only trusted code is deployed.
      Prevents deployment of tampered or unauthorized code.
    control_functions: [preventive]
    cost: medium

  # ============================================================================
  # API Gateway Countermeasures
  # ============================================================================
  - id: apigw-cognito-auth
    name: API Gateway Cognito Authorization
    description: |
      Use Amazon Cognito user pools for API authentication.
      Provides JWT validation, MFA support, and user management.
    control_functions: [preventive]
    cost: medium

  - id: apigw-api-key
    name: API Gateway API Keys
    description: |
      Require API keys for access with usage plans.
      Enables tracking, throttling per key, and easy revocation.
    control_functions: [preventive]
    cost: low

  - id: apigw-waf
    name: API Gateway WAF Integration
    description: |
      Enable AWS WAF to protect against common web exploits.
      Block SQL injection, XSS, and known bad actors.
    control_functions: [preventive]
    cost: medium

  - id: apigw-throttling
    name: API Gateway Throttling
    description: |
      Configure request throttling at stage and method levels.
      Protects backend from overload and mitigates DoS attacks.
    control_functions: [preventive]
    cost: low

  - id: apigw-request-validation
    name: API Gateway Request Validation
    description: |
      Enable request validation to reject malformed requests early.
      Validate required parameters, headers, and body schema.
    control_functions: [preventive]
    cost: low

  - id: apigw-cloudwatch-logging
    name: API Gateway CloudWatch Logging
    description: |
      Enable detailed CloudWatch logging for all API requests.
      Captures request/response details for security analysis.
    control_functions: [detective]
    cost: low

  # ============================================================================
  # DynamoDB Countermeasures
  # ============================================================================
  - id: dynamodb-fine-grained-access
    name: DynamoDB Fine-Grained Access Control
    description: |
      Use IAM conditions for item-level access control.
      Restrict access based on partition key values or attributes.
    control_functions: [preventive]
    cost: medium

  - id: dynamodb-encryption
    name: DynamoDB Encryption at Rest
    description: |
      Enable encryption using AWS-owned, AWS-managed, or customer-managed KMS keys.
      Protects data at rest from unauthorized access.
    control_functions: [preventive]
    cost: low

  - id: dynamodb-pitr
    name: DynamoDB Point-in-Time Recovery
    description: |
      Enable continuous backups with point-in-time recovery.
      Restore to any second in the last 35 days.
    control_functions: [corrective]
    cost: medium

  - id: dynamodb-vpc-endpoint
    name: DynamoDB VPC Endpoint
    description: |
      Use VPC endpoint to keep DynamoDB traffic within AWS network.
      Reduces exposure and enables endpoint policies.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # SQS Countermeasures
  # ============================================================================
  - id: sqs-encryption
    name: SQS Server-Side Encryption
    description: |
      Enable SSE-SQS or SSE-KMS encryption for messages at rest.
      Protects message content from unauthorized access.
    control_functions: [preventive]
    cost: low

  - id: sqs-queue-policy
    name: SQS Queue Access Policy
    description: |
      Configure queue policies to restrict who can send/receive messages.
      Use conditions for VPC endpoints or specific principals.
    control_functions: [preventive]
    cost: low

  - id: sqs-dlq
    name: SQS Dead-Letter Queue
    description: |
      Configure dead-letter queues for failed message handling.
      Enables analysis of problematic messages without blocking.
    control_functions: [detective]
    cost: low

  - id: sqs-message-validation
    name: SQS Consumer Message Validation
    description: |
      Validate message format and content before processing.
      Reject messages that don't match expected schema.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # Data Flow Countermeasures (protect data in transit)
  # ============================================================================
  - id: tls-encryption
    name: TLS/SSL Encryption
    description: |
      Encrypt all data in transit using TLS 1.2 or higher.
      Protects against eavesdropping and ensures data integrity.
    control_functions: [preventive]
    cost: low

  - id: mutual-tls
    name: Mutual TLS Authentication
    description: |
      Require both client and server to present certificates for authentication.
      Prevents unauthorized clients from connecting to services.
    control_functions: [preventive]
    cost: medium

  - id: request-signing
    name: Request Signing (HMAC/SigV4)
    description: |
      Sign all requests with HMAC or AWS Signature Version 4.
      Prevents replay attacks and ensures request integrity.
    control_functions: [preventive]
    cost: low

  - id: vpc-private-link
    name: VPC PrivateLink
    description: |
      Use AWS PrivateLink to keep traffic within AWS network.
      Eliminates exposure to public internet for service communication.
    control_functions: [preventive]
    cost: medium

  - id: api-gateway-private
    name: Private API Gateway Endpoint
    description: |
      Configure API Gateway with private endpoints accessible only from VPC.
      Reduces attack surface by eliminating public access.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # Bedrock / LLM Countermeasures
  # ============================================================================
  - id: bedrock-guardrails
    name: Bedrock Guardrails
    description: |
      Configure Amazon Bedrock Guardrails to filter harmful content, enforce topic
      restrictions, and block sensitive information in inputs and outputs. Supports
      denied topics, content filters, word filters, sensitive information filters,
      and contextual grounding checks.
    control_functions: [preventive]
    cost: medium

  - id: bedrock-input-validation
    name: Bedrock Prompt Input Validation
    description: |
      Validate and sanitize all user input before inclusion in LLM prompts.
      Apply character allowlists, encoding normalization, length limits, and
      prompt injection detection classifiers to prevent adversarial inputs.
    control_functions: [preventive]
    cost: medium

  - id: bedrock-output-filtering
    name: Bedrock Output Filtering
    description: |
      Scan and filter all LLM-generated outputs before returning to users.
      Detect and redact sensitive data (PII, PAN, credentials), block policy-
      violating content, and validate output schema conformance.
    control_functions: [detective]
    cost: medium

  - id: bedrock-vpc-endpoint
    name: Bedrock VPC Endpoint
    description: |
      Use VPC endpoint for Amazon Bedrock to keep model invocation traffic within
      the AWS network. Prevents exposure to public internet and enables endpoint
      policies for fine-grained access control.
    control_functions: [preventive]
    cost: low

  - id: bedrock-model-invocation-logging
    name: Bedrock Model Invocation Logging
    description: |
      Enable model invocation logging to capture prompts, completions, token usage,
      and metadata for all Bedrock API calls. Logs stored in S3 or CloudWatch for
      audit, forensics, and compliance.
    control_functions: [detective]
    cost: low

  - id: bedrock-token-budget
    name: Bedrock Token and Cost Budget
    description: |
      Set per-request and per-session token limits, configure service quotas, and
      implement cost alerts for Bedrock model invocations. Prevents runaway costs
      and resource abuse from excessive or automated requests.
    control_functions: [preventive]
    cost: low

  - id: bedrock-data-masking
    name: Sensitive Data Masking Before LLM
    description: |
      Tokenize, mask, or redact sensitive data (PAN, PII, credentials) before
      including in LLM prompts or RAG context. Use reversible tokenization to
      restore data in responses when needed.
    control_functions: [preventive]
    cost: medium

  # ============================================================================
  # RAG / OpenSearch Serverless Countermeasures
  # ============================================================================
  - id: rag-access-control
    name: RAG Document-Level Access Control
    description: |
      Enforce end-user authorization at each stage of the RAG pipeline. Apply
      document-level metadata filters during semantic search to ensure users
      only retrieve documents they are authorized to access.
    control_functions: [preventive]
    cost: high

  - id: rag-data-sanitization
    name: RAG Data Sanitization
    description: |
      Validate and sanitize all documents before ingestion into the RAG knowledge
      base. Scan for prompt injection payloads, malicious content, and verify
      data integrity to prevent knowledge base poisoning.
    control_functions: [preventive]
    cost: medium

  - id: opensearch-encryption
    name: OpenSearch Serverless Encryption
    description: |
      Enable encryption at rest (AWS-owned or customer-managed KMS keys) and
      enforce TLS for data in transit for OpenSearch Serverless collections.
      Protects vector embeddings and source documents.
    control_functions: [preventive]
    cost: low

  - id: opensearch-access-policy
    name: OpenSearch Serverless Access Policy
    description: |
      Configure data access policies and network access policies for OpenSearch
      Serverless collections. Restrict access to authorized IAM principals and
      VPC endpoints using least-privilege policies.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # Cognito Countermeasures
  # ============================================================================
  - id: cognito-mfa
    name: Cognito MFA Enforcement
    description: |
      Require multi-factor authentication for all Cognito user pool sign-ins.
      Supports TOTP, SMS, and email-based MFA. Prevents account compromise
      from stolen credentials alone.
    control_functions: [preventive]
    cost: low

  - id: cognito-advanced-security
    name: Cognito Advanced Security
    description: |
      Enable Cognito advanced security features including adaptive authentication,
      compromised credential detection, and risk-based access decisions. Blocks
      sign-ins from suspicious locations or devices.
    control_functions: [detective]
    cost: medium

  # ============================================================================
  # WAF Countermeasures
  # ============================================================================
  - id: waf-managed-rules
    name: WAF Managed Rule Groups
    description: |
      Deploy AWS WAF managed rule groups (Core Rule Set, Known Bad Inputs, SQL
      Injection, Bot Control) for comprehensive protection against common web
      exploits. Regularly update rule versions.
    control_functions: [preventive]
    cost: medium

  # ============================================================================
  # CloudWatch Countermeasures
  # ============================================================================
  - id: cloudwatch-alarm
    name: CloudWatch Security Alarms
    description: |
      Configure CloudWatch alarms for security-relevant metrics and anomalies.
      Monitor failed authentication attempts, unusual API call patterns, model
      invocation spikes, and error rates with automated notifications.
    control_functions: [detective]
    cost: low

  # ============================================================================
  # IAM Countermeasures
  # ============================================================================
  - id: iam-least-privilege
    name: IAM Least Privilege Policies
    description: |
      Enforce least-privilege IAM policies by removing wildcard actions and
      resources. Scope permissions to specific services, actions, and resource
      ARNs. Use IAM policy conditions to restrict by source IP, VPC, or MFA.
    control_functions: [preventive]
    cost: medium

  - id: iam-access-key-rotation
    name: IAM Access Key Rotation
    description: |
      Rotate IAM user access keys at least every 90 days. Prefer IAM roles
      and temporary credentials from STS over long-lived access keys.
      Remove unused or inactive access keys promptly.
    control_functions: [preventive]
    cost: low

  - id: iam-mfa-enforcement
    name: IAM MFA Enforcement
    description: |
      Require multi-factor authentication for all IAM users with console
      access and for the root account. Use hardware MFA for root and
      privileged accounts. Enforce MFA via IAM policy conditions for
      sensitive API operations.
    control_functions: [preventive]
    cost: low

  - id: iam-password-policy
    name: IAM Strong Password Policy
    description: |
      Configure the account password policy to require minimum 14-character
      passwords with complexity requirements, prevent password reuse, and
      enforce periodic rotation. Blocks brute-force and credential stuffing.
    control_functions: [preventive]
    cost: low

  - id: iam-root-protection
    name: IAM Root Account Protection
    description: |
      Remove root user access keys, enable hardware MFA on the root account,
      and avoid using root for routine operations. Restrict root usage to
      account-level operations that only root can perform.
    control_functions: [preventive]
    cost: low

  - id: iam-access-analyzer
    name: IAM Access Analyzer
    description: |
      Enable IAM Access Analyzer to continuously monitor resource policies
      for external access grants. Detects unintended public or cross-account
      access to S3 buckets, IAM roles, KMS keys, Lambda functions, and
      SQS queues.
    control_functions: [detective]
    cost: low

  - id: iam-credential-report
    name: IAM Credential Report Monitoring
    description: |
      Generate and review IAM credential reports to identify unused
      credentials, users without MFA, stale access keys, and accounts
      with console passwords that should be removed.
    control_functions: [detective]
    cost: low

  - id: iam-permission-boundaries
    name: IAM Permission Boundaries
    description: |
      Apply permission boundaries to IAM roles and users to set the maximum
      permissions that can be granted regardless of attached policies.
      Prevents privilege escalation through policy modification.
    control_functions: [preventive]
    cost: medium

  # ============================================================================
  # KMS Countermeasures
  # ============================================================================
  - id: kms-restrictive-key-policy
    name: KMS Restrictive Key Policy
    description: |
      Configure KMS key policies to allow only specific IAM principals to
      perform decrypt and encrypt operations. Avoid wildcard principals
      and scope access to specific accounts and roles.
    control_functions: [preventive]
    cost: low

  - id: kms-key-rotation
    name: KMS Automatic Key Rotation
    description: |
      Enable automatic annual key rotation for customer-managed KMS keys.
      Rotation creates new backing key material while retaining previous
      versions for decryption, reducing exposure from compromised keys.
    control_functions: [preventive]
    cost: low

  - id: kms-deletion-protection
    name: KMS Key Deletion Protection
    description: |
      Monitor and alert on KMS keys scheduled for deletion. Extend the
      mandatory waiting period and implement approval workflows before
      key deletion can proceed. Cancel unintended deletion within the
      waiting period.
    control_functions: [detective]
    cost: low

  - id: kms-key-usage-logging
    name: KMS Key Usage Logging via CloudTrail
    description: |
      Enable CloudTrail logging for all KMS API calls to track key usage,
      policy changes, and key management operations. Monitor for anomalous
      decryption patterns or unauthorized key access attempts.
    control_functions: [detective]
    cost: low

  # ============================================================================
  # VPC Countermeasures
  # ============================================================================
  - id: vpc-restrictive-security-groups
    name: Restrictive Security Group Rules
    description: |
      Configure security groups with least-privilege inbound rules. Restrict
      source IPs to known ranges, limit ports to those required by the application,
      and never allow 0.0.0.0/0 to management ports (SSH, RDP, database ports).
    control_functions: [preventive]
    cost: low

  - id: vpc-flow-logs
    name: VPC Flow Logs
    description: |
      Enable VPC flow logs to capture information about IP traffic going to and
      from network interfaces. Send logs to CloudWatch Logs or S3 for analysis.
      Configure REJECT filter at minimum for security monitoring.
    control_functions: [detective]
    cost: low

  - id: vpc-private-subnets
    name: Private Subnet Deployment
    description: |
      Deploy workloads in private subnets without direct internet access. Use
      NAT gateways for outbound connectivity and load balancers or API Gateway
      for inbound traffic. Disable auto-assign public IP on all subnets.
    control_functions: [preventive]
    cost: low

  - id: vpc-network-segmentation
    name: Network Segmentation
    description: |
      Separate workloads into distinct subnets based on trust level and function.
      Use security groups and NACLs to enforce boundaries between tiers (web,
      application, data). Apply separate security groups per workload.
    control_functions: [preventive]
    cost: medium

  - id: vpc-default-sg-lockdown
    name: Default Security Group Lockdown
    description: |
      Remove all inbound and outbound rules from the VPC default security group.
      Do not associate the default security group with any resources. Create
      purpose-specific security groups for all workloads.
    control_functions: [preventive]
    cost: low

  - id: vpc-nacls
    name: Network ACL Restrictions
    description: |
      Configure Network ACLs as a secondary defense layer to restrict traffic at
      the subnet level. Block known malicious IP ranges and restrict access to
      sensitive subnets. NACLs provide stateless filtering complementing stateful
      security groups.
    control_functions: [preventive]
    cost: low

  - id: vpc-endpoints
    name: VPC Endpoints for AWS Services
    description: |
      Use VPC gateway and interface endpoints to access AWS services without
      traversing the public internet. Apply endpoint policies to restrict
      which principals and actions are allowed through the endpoint.
    control_functions: [preventive]
    cost: medium
    default_status: platform

  # ============================================================================
  # EC2 Countermeasures
  # ============================================================================
  - id: ec2-imdsv2-enforcement
    name: IMDSv2 Enforcement
    description: |
      Require Instance Metadata Service Version 2 (IMDSv2) for all EC2 instances.
      IMDSv2 uses session-oriented requests with a token, preventing SSRF-based
      credential theft. Set HttpTokens to required in launch templates and
      instance metadata options.
    control_functions: [preventive]
    cost: low

  - id: ec2-no-public-ip
    name: EC2 No Public IP Assignment
    description: |
      Ensure EC2 instances do not receive public IPv4 addresses. Disable auto-assign
      public IP in subnet settings and launch templates. Route inbound traffic
      through load balancers, bastion hosts, or AWS Systems Manager Session Manager.
    control_functions: [preventive]
    cost: low

  - id: ec2-ebs-encryption
    name: EBS Encryption at Rest
    description: |
      Enable EBS default encryption at the account/region level to ensure all new
      volumes and snapshots are encrypted using AWS KMS. Protects data at rest from
      unauthorized access through snapshot sharing or physical media theft.
    control_functions: [preventive]
    cost: low
    default_status: platform

  - id: ec2-least-privilege-profile
    name: EC2 Least Privilege Instance Profile
    description: |
      Assign IAM instance profiles with minimum required permissions for each
      workload. Use separate roles per application. Avoid attaching AWS managed
      policies with broad access (AdministratorAccess, PowerUserAccess).
    control_functions: [preventive]
    cost: low

  - id: ec2-patch-management
    name: EC2 Automated Patch Management
    description: |
      Use AWS Systems Manager Patch Manager to automate operating system and
      application patching. Define patch baselines and maintenance windows.
      Monitor compliance status and remediate non-compliant instances.
    control_functions: [preventive]
    cost: medium

  - id: ec2-restrict-outbound
    name: EC2 Restrict Outbound Traffic
    description: |
      Configure security group outbound rules to allow only necessary egress
      traffic. Restrict outbound to specific CIDR ranges, ports, and protocols
      required by the application. Limits command-and-control communication and
      data exfiltration from compromised instances.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # ELB Countermeasures
  # ============================================================================
  - id: elb-https-listeners
    name: ELB HTTPS/TLS Listeners
    description: |
      Configure all load balancer listeners to use HTTPS (ALB) or TLS (NLB)
      protocols. Add HTTP-to-HTTPS redirect rules on all HTTP listeners.
      Ensures encryption of data in transit between clients and the load balancer.
    control_functions: [preventive]
    cost: low

  - id: elb-waf-association
    name: ELB WAF Association
    description: |
      Associate AWS WAF web ACLs with Application Load Balancers. Deploy managed
      rule groups (Core Rule Set, Known Bad Inputs, Bot Control) to filter
      malicious requests before they reach backend targets.
    control_functions: [preventive]
    cost: medium

  - id: elb-access-logging
    name: ELB Access Logging
    description: |
      Enable access logging on Application and Classic Load Balancers to capture
      detailed request information including client IP, latencies, request paths,
      and server responses. Store logs in S3 for security analysis.
    control_functions: [detective]
    cost: low

  - id: elb-modern-tls-policy
    name: ELB Modern TLS Security Policy
    description: |
      Configure load balancer listeners with TLS 1.3 security policies
      (ELBSecurityPolicy-TLS13-1-2-Res-2021-06 or newer). Disables weak cipher
      suites and deprecated protocol versions, preventing downgrade attacks.
    control_functions: [preventive]
    cost: low

  - id: elb-desync-mitigation
    name: ELB Desync Mitigation Mode
    description: |
      Configure Application Load Balancers with defensive or strictest desync
      mitigation mode. Protects against HTTP request smuggling attacks by
      classifying and handling ambiguous HTTP requests appropriately.
    control_functions: [preventive]
    cost: low

  - id: elb-deletion-protection
    name: ELB Deletion Protection
    description: |
      Enable deletion protection on load balancers to prevent accidental or
      malicious deletion. Requires explicit disabling before the load balancer
      can be removed, providing safeguard against destructive actions.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # RDS / Aurora Countermeasures
  # ============================================================================
  - id: rds-no-public-access
    name: RDS Disable Public Accessibility
    description: |
      Configure RDS instances with PubliclyAccessible set to false. Deploy databases in
      private subnets without routes to internet gateways. Use VPC security groups to
      restrict access to authorized application-tier resources only.
    control_functions: [preventive]
    cost: low

  - id: rds-snapshot-private
    name: RDS Private Snapshots
    description: |
      Ensure all RDS snapshots are private and not shared publicly. Encrypt snapshots with
      KMS to prevent unauthorized access even if snapshot sharing is misconfigured. Review
      snapshot sharing permissions regularly.
    control_functions: [preventive]
    cost: low

  - id: rds-encryption-at-rest
    name: RDS Encryption at Rest
    description: |
      Enable encryption at rest for RDS instances and clusters using AWS KMS keys. Ensures
      data, automated backups, read replicas, and snapshots are encrypted. Use customer-managed
      KMS keys for additional control over key policies.
    control_functions: [preventive]
    cost: low

  - id: rds-encryption-in-transit
    name: RDS Enforce TLS Connections
    description: |
      Enforce TLS encryption for all database connections. Configure rds.force_ssl parameter
      for PostgreSQL, require_secure_transport for MySQL/MariaDB, or use RDS Proxy with TLS
      requirement. Reject unencrypted connections at the database level.
    control_functions: [preventive]
    cost: low

  - id: rds-iam-authentication
    name: RDS IAM Database Authentication
    description: |
      Enable IAM database authentication to eliminate static database passwords. Applications
      use temporary IAM credentials instead of long-lived passwords. Provides centralized
      access management, credential rotation, and CloudTrail audit logging of database access.
    control_functions: [preventive]
    cost: medium

  - id: rds-automated-backups
    name: RDS Automated Backups and PITR
    description: |
      Enable automated backups with sufficient retention period (minimum 7 days recommended).
      Provides point-in-time recovery capability for data loss scenarios. Enable backtracking
      for Aurora MySQL clusters for rapid recovery without restore.
    control_functions: [corrective]
    cost: low

  - id: rds-deletion-protection
    name: RDS Deletion Protection
    description: |
      Enable deletion protection on RDS instances and clusters to prevent accidental or
      malicious deletion. Requires an explicit modification to disable protection before
      the resource can be deleted.
    control_functions: [preventive]
    cost: low

  - id: rds-audit-logging
    name: RDS Database Audit Logging
    description: |
      Enable database-level audit logging and publish logs to CloudWatch Logs. Configure
      audit logs for PostgreSQL, MySQL audit plugin, or Oracle audit trails. Enables
      detection of unauthorized queries and compliance auditing.
    control_functions: [detective]
    cost: low

  - id: rds-multi-az
    name: RDS Multi-AZ Deployment
    description: |
      Deploy RDS instances and Aurora clusters in Multi-AZ configuration for high availability.
      Provides automatic failover during infrastructure failures, reducing risk of service
      disruption from single availability zone outages.
    control_functions: [preventive]
    cost: medium

  # ============================================================================
  # CloudTrail Countermeasures
  # ============================================================================
  - id: cloudtrail-multi-region
    name: CloudTrail Multi-Region Trail
    description: |
      Configure at least one CloudTrail trail as multi-region, capturing read and write
      management events across all AWS regions. Eliminates blind spots from region-specific
      trails and ensures global service events are recorded.
    control_functions: [detective]
    cost: low

  - id: cloudtrail-log-validation
    name: CloudTrail Log File Validation
    description: |
      Enable log file integrity validation on all CloudTrail trails. Creates digitally signed
      digest files that detect whether log files were modified, deleted, or unchanged after
      delivery. Essential for forensic integrity.
    control_functions: [detective]
    cost: low

  - id: cloudtrail-encryption
    name: CloudTrail KMS Encryption
    description: |
      Encrypt CloudTrail log files using a customer-managed KMS key (SSE-KMS). Provides
      additional access control beyond S3 bucket policies through KMS key policies, and
      creates an audit trail of who accessed the encryption key.
    control_functions: [preventive]
    cost: low

  - id: cloudtrail-log-bucket-security
    name: CloudTrail S3 Bucket Access Restriction
    description: |
      Block public access on the S3 bucket storing CloudTrail logs. Apply restrictive bucket
      policies limiting access to CloudTrail service and authorized security principals only.
      Enable S3 access logging on the CloudTrail bucket.
    control_functions: [preventive]
    cost: low

  - id: cloudtrail-cloudwatch-integration
    name: CloudTrail CloudWatch Logs Integration
    description: |
      Integrate CloudTrail with CloudWatch Logs for real-time monitoring. Configure metric
      filters and alarms for critical security events including root account usage, IAM
      policy changes, unauthorized API calls, and security group modifications.
    control_functions: [detective]
    cost: low

  # ============================================================================
  # Batch 2: Containers, Secrets, Edge, DNS
  # ============================================================================

  # ============================================================================
  # ECS Countermeasures
  # ============================================================================
  - id: ecs-no-privileged-containers
    name: ECS Disable Privileged Mode
    description: |
      Configure ECS task definitions with privileged set to false for all containers.
      Prevents containers from gaining elevated kernel capabilities and reduces the
      risk of container escape to the underlying host.
    control_functions: [preventive]
    cost: low

  - id: ecs-no-host-namespace
    name: ECS Disable Host Namespace Sharing
    description: |
      Ensure ECS task definitions do not share the host PID or network namespace.
      Set pidMode and networkMode to avoid "host" values. Maintains container
      isolation boundaries.
    control_functions: [preventive]
    cost: low

  - id: ecs-secrets-from-secrets-manager
    name: ECS Secrets from Secrets Manager
    description: |
      Reference secrets in ECS task definitions using valueFrom with AWS Secrets
      Manager or SSM Parameter Store ARNs instead of plaintext environment variables.
      Secrets are injected at runtime and not visible in task definition history.
    control_functions: [preventive]
    cost: low

  - id: ecs-no-public-ip
    name: ECS Fargate No Public IP
    description: |
      Configure ECS Fargate tasks with assignPublicIp set to DISABLED. Route
      inbound traffic through Application Load Balancers or API Gateway and use
      NAT gateways for outbound internet access.
    control_functions: [preventive]
    cost: low

  - id: ecs-logging-enabled
    name: ECS Container Logging Configuration
    description: |
      Configure all ECS task definitions with a log driver (awslogs recommended)
      to send container stdout/stderr to CloudWatch Logs. Enable execution role
      permissions for log group creation and log stream writing.
    control_functions: [detective]
    cost: low

  - id: ecs-readonly-root-filesystem
    name: ECS Read-Only Root Filesystem
    description: |
      Set readonlyRootFilesystem to true in ECS container definitions. Use tmpfs
      mounts or EFS volumes for directories requiring write access. Prevents
      attackers from modifying container binaries or installing persistence tools.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # EKS Countermeasures
  # ============================================================================
  - id: eks-private-endpoint
    name: EKS Private Cluster Endpoint
    description: |
      Disable the EKS public API endpoint and enable the private endpoint. Access
      the Kubernetes API only from within the VPC or through a bastion host, VPN,
      or AWS PrivateLink connection.
    control_functions: [preventive]
    cost: medium

  - id: eks-version-management
    name: EKS Kubernetes Version Management
    description: |
      Maintain EKS clusters on a supported Kubernetes version. Enable Amazon EKS
      extended support or plan version upgrades before the standard support end
      date. Monitor the EKS version calendar and automate upgrade testing.
    control_functions: [preventive]
    cost: medium

  - id: eks-envelope-encryption
    name: EKS Secrets Envelope Encryption
    description: |
      Enable envelope encryption for Kubernetes secrets using a customer-managed
      AWS KMS key. Secrets stored in etcd are encrypted with a data encryption key
      that is itself encrypted by the KMS key.
    control_functions: [preventive]
    cost: low

  - id: eks-audit-logging
    name: EKS Control Plane Logging
    description: |
      Enable all EKS control plane log types (audit, authenticator, controllerManager,
      scheduler, api) and send them to CloudWatch Logs. Provides visibility into
      Kubernetes API requests for security monitoring and incident investigation.
    control_functions: [detective]
    cost: low

  - id: eks-rbac-least-privilege
    name: EKS RBAC Least Privilege
    description: |
      Configure Kubernetes RBAC with least-privilege roles scoped to specific
      namespaces, resources, and verbs. Avoid wildcard permissions and binding
      cluster-admin to service accounts. Use separate service accounts per workload.
    control_functions: [preventive]
    cost: medium

  # ============================================================================
  # ECR Countermeasures
  # ============================================================================
  - id: ecr-immutable-tags
    name: ECR Immutable Image Tags
    description: |
      Enable image tag immutability on ECR repositories. Prevents any image tag
      from being overwritten after initial push. Forces use of unique tags for
      each build, ensuring deployment integrity.
    control_functions: [preventive]
    cost: low

  - id: ecr-image-scanning
    name: ECR Image Scanning on Push
    description: |
      Enable scan-on-push for ECR repositories using basic scanning (Clair) or
      enhanced scanning (Amazon Inspector). Automatically identifies known CVEs
      in OS packages and application libraries before deployment.
    control_functions: [detective]
    cost: low

  - id: ecr-lifecycle-policy
    name: ECR Lifecycle Policy
    description: |
      Configure ECR lifecycle policies to expire untagged images and retain only
      a specified number of tagged images. Reduces attack surface from stale images
      and controls storage costs.
    control_functions: [preventive]
    cost: low

  - id: ecr-restrictive-policy
    name: ECR Restrictive Repository Policy
    description: |
      Configure ECR repository policies to allow image pull and push only from
      authorized IAM principals and AWS accounts. Block public access and restrict
      cross-account sharing to trusted accounts only.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # Secrets Manager Countermeasures
  # ============================================================================
  - id: secrets-manager-rotation
    name: Secrets Manager Automatic Rotation
    description: |
      Enable automatic rotation for all secrets using Lambda rotation functions.
      Configure rotation intervals appropriate to the secret type (30-90 days
      for database credentials, shorter for API keys). Use Secrets Manager native
      integration for RDS, Redshift, and DocumentDB credentials.
    control_functions: [preventive]
    cost: medium

  - id: secrets-manager-cmk-encryption
    name: Secrets Manager Customer-Managed KMS Key
    description: |
      Encrypt secrets with customer-managed KMS keys instead of the default AWS-managed
      key. Enables fine-grained access control through KMS key policies, separate audit
      logging of decryption operations, and cross-account encryption key management.
    control_functions: [preventive]
    cost: low

  - id: secrets-manager-resource-policy
    name: Secrets Manager Resource Policy
    description: |
      Attach resource-based policies to secrets to restrict access beyond IAM identity
      policies. Use conditions to limit access by source VPC endpoint, IP range, or
      require specific KMS encryption context. Deny cross-account access unless
      explicitly required.
    control_functions: [preventive]
    cost: low

  - id: secrets-manager-deletion-protection
    name: Secrets Manager Deletion Recovery Window
    description: |
      Configure secret deletion with the maximum recovery window (30 days) to allow
      cancellation of unintended deletions. Monitor for DeleteSecret API calls via
      CloudTrail and set CloudWatch alarms for deletion events. Never use
      ForceDeleteWithoutRecovery in production.
    control_functions: [detective]
    cost: low

  # ============================================================================
  # CloudFront Countermeasures
  # ============================================================================
  - id: cloudfront-https-only
    name: CloudFront HTTPS-Only Origin Protocol
    description: |
      Configure CloudFront distributions to communicate with origins using HTTPS only
      (origin protocol policy: https-only). Ensure origin SSL certificates are valid
      and match the expected domain. Use TLS 1.2 or higher for origin connections.
    control_functions: [preventive]
    cost: low

  - id: cloudfront-waf-integration
    name: CloudFront WAF Integration
    description: |
      Associate AWS WAF web ACLs with CloudFront distributions. Deploy managed rule
      groups (Core Rule Set, Known Bad Inputs, Bot Control) and custom rules for
      application-specific protection. Rate-limit requests to prevent abuse.
    control_functions: [preventive]
    cost: medium

  - id: cloudfront-custom-ssl
    name: CloudFront Custom SSL Certificate
    description: |
      Use a custom SSL/TLS certificate from AWS Certificate Manager (ACM) instead
      of the default CloudFront certificate. Enables HTTPS on custom domain names
      and allows viewers to verify domain identity.
    control_functions: [preventive]
    cost: low

  - id: cloudfront-access-logging
    name: CloudFront Standard Access Logging
    description: |
      Enable standard access logging to capture detailed information about viewer
      requests including client IP, request URI, edge location, HTTP status, and
      cache behavior. Store logs in S3 for security analysis and incident investigation.
    control_functions: [detective]
    cost: low

  - id: cloudfront-modern-tls
    name: CloudFront Modern TLS Policy
    description: |
      Configure CloudFront distributions with a security policy that requires TLS 1.2
      or higher (TLSv1.2_2021 or newer). Disables deprecated protocol versions and weak
      cipher suites, preventing protocol downgrade attacks.
    control_functions: [preventive]
    cost: low

  - id: cloudfront-origin-access-control
    name: CloudFront Origin Access Control
    description: |
      Configure Origin Access Control (OAC) for S3 origins to ensure the S3 bucket
      is only accessible through CloudFront. OAC supports S3 SSE-KMS encryption,
      S3 Object Lambda, and all S3 regions, replacing the legacy Origin Access Identity.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # Route 53 Countermeasures
  # ============================================================================
  - id: route53-dnssec
    name: Route 53 DNSSEC Signing
    description: |
      Enable DNSSEC signing on public hosted zones to cryptographically sign DNS
      records. Provides authentication of DNS responses, protecting against DNS
      spoofing and cache poisoning. Manage the key-signing key (KSK) through
      Route 53 and KMS.
    control_functions: [preventive]
    cost: low

  - id: route53-query-logging
    name: Route 53 Query Logging
    description: |
      Enable DNS query logging to CloudWatch Logs for public hosted zones.
      Captures queried domain names, record types, response codes, and resolver
      information. Enables detection of DNS reconnaissance and anomalous patterns.
    control_functions: [detective]
    cost: low

  - id: route53-transfer-lock
    name: Route 53 Domain Transfer Lock
    description: |
      Enable the transfer lock on all domains registered with Route 53 to prevent
      unauthorized domain transfers. Requires explicit unlock action before a domain
      can be transferred to another registrar.
    control_functions: [preventive]
    cost: low

  - id: route53-health-checks
    name: Route 53 Health Checks
    description: |
      Configure Route 53 health checks to monitor endpoint availability and
      automatically failover DNS routing when primary endpoints become unhealthy.
      Set CloudWatch alarms on health check status changes for rapid detection.
    control_functions: [detective]
    cost: low

  # ============================================================================
  # Batch 3: Integration, Events, DevOps, Detection, Data, AI
  # ============================================================================

  # ============================================================================
  # SNS Countermeasures
  # ============================================================================
  - id: sns-topic-policy
    name: SNS Restrictive Topic Policy
    description: |
      Configure SNS topic resource policies with least-privilege access,
      restricting publish and subscribe permissions to specific principals
      and adding conditions for source account, VPC, or IP range.
    control_functions: [preventive]
    cost: low

  - id: sns-encryption
    name: SNS Topic Encryption
    description: |
      Enable server-side encryption on SNS topics using KMS customer-managed
      keys to protect message content at rest and control access through
      KMS key policies.
    control_functions: [preventive]
    cost: low

  - id: sns-https-subscription
    name: SNS HTTPS-Only Subscriptions
    description: |
      Configure SNS subscriptions to use HTTPS endpoints only, ensuring
      notification payloads are encrypted in transit. Deny HTTP protocol
      subscriptions via topic policy conditions.
    control_functions: [preventive]
    cost: low

  - id: sns-access-logging
    name: SNS Delivery Status Logging
    description: |
      Enable SNS delivery status logging to CloudWatch for all subscription
      protocols to track successful and failed message deliveries and detect
      unauthorized publish activity.
    control_functions: [detective]
    cost: low

  # ============================================================================
  # EventBridge Countermeasures
  # ============================================================================
  - id: eventbridge-restrictive-rules
    name: EventBridge Least-Privilege Event Patterns
    description: |
      Define EventBridge rules with specific event patterns that match only
      intended event sources and detail types, preventing unintended routing
      of sensitive events to unauthorized targets.
    control_functions: [preventive]
    cost: low

  - id: eventbridge-bus-policy
    name: EventBridge Event Bus Resource Policy
    description: |
      Configure resource policies on custom event buses restricting
      PutEvents permissions to authorized accounts and principals with
      condition keys for source and event type.
    control_functions: [preventive]
    cost: low

  - id: eventbridge-dlq
    name: EventBridge Dead-Letter Queue Configuration
    description: |
      Attach dead-letter queues to EventBridge rules to capture failed event
      deliveries, enabling retry processing and providing visibility into
      delivery failures.
    control_functions: [detective]
    cost: low

  - id: eventbridge-encryption
    name: EventBridge Custom Bus KMS Encryption
    description: |
      Enable KMS encryption on custom EventBridge event buses to protect
      event payloads at rest using customer-managed keys.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # Step Functions Countermeasures
  # ============================================================================
  - id: stepfunctions-least-privilege-role
    name: Step Functions Least-Privilege Execution Role
    description: |
      Configure state machine execution roles with minimum required
      permissions for each task state, using resource-level policies
      rather than broad service-level access.
    control_functions: [preventive]
    cost: low

  - id: stepfunctions-execution-logging
    name: Step Functions CloudWatch Execution Logging
    description: |
      Enable execution logging at ALL or ERROR level to CloudWatch Logs,
      capturing state transitions, input/output payloads, and error
      conditions for audit and incident response.
    control_functions: [detective]
    cost: low

  - id: stepfunctions-input-sanitization
    name: Step Functions Input/Output Processing
    description: |
      Use InputPath, OutputPath, and ResultPath filters to strip sensitive
      data from state machine execution history, preventing credentials
      and PII from being persisted in execution records.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # AppSync Countermeasures
  # ============================================================================
  - id: appsync-authorization
    name: AppSync API Authorization
    description: |
      Configure AppSync with an appropriate authorization mode (Cognito,
      IAM, OIDC, or Lambda authorizer) to enforce authentication and
      authorization on all GraphQL operations.
    control_functions: [preventive]
    cost: low

  - id: appsync-introspection-disabled
    name: AppSync Introspection Query Restriction
    description: |
      Disable or restrict GraphQL introspection queries in production
      environments to prevent schema enumeration by unauthorized users.
    control_functions: [preventive]
    cost: low

  - id: appsync-logging
    name: AppSync Request and Field-Level Logging
    description: |
      Enable both request-level and field-level logging to CloudWatch,
      capturing resolver execution details, authorization failures, and
      query patterns for monitoring and incident response.
    control_functions: [detective]
    cost: low

  - id: appsync-waf
    name: AppSync WAF Association
    description: |
      Associate a WAF web ACL with AppSync to protect against common
      web attacks, enforce query complexity limits, and rate-limit
      abusive query patterns.
    control_functions: [preventive]
    cost: medium

  # ============================================================================
  # ACM Countermeasures
  # ============================================================================
  - id: acm-auto-renewal
    name: ACM Automatic Certificate Renewal
    description: |
      Use ACM-managed certificates with automatic renewal enabled to
      prevent certificate expiration. Monitor renewal status via
      CloudWatch events for certificates requiring domain validation.
    control_functions: [preventive]
    cost: low

  - id: acm-dedicated-certificates
    name: ACM Per-Service Certificate Issuance
    description: |
      Issue separate certificates per service or environment rather than
      sharing wildcard certificates across trust boundaries, limiting
      the blast radius of a private key compromise.
    control_functions: [preventive]
    cost: low

  - id: acm-certificate-transparency
    name: ACM Certificate Transparency Logging
    description: |
      Enable certificate transparency logging for all ACM certificates
      to allow monitoring for unauthorized certificate issuance via
      CT log monitoring services.
    control_functions: [detective]
    cost: low

  # ============================================================================
  # EBS Countermeasures
  # ============================================================================
  - id: ebs-snapshot-private
    name: EBS Snapshot Privacy Enforcement
    description: |
      Ensure EBS snapshots are not shared publicly. Use AWS Config rules
      or IAM policies with ec2:ModifySnapshotAttribute deny conditions
      to prevent accidental public sharing.
    control_functions: [preventive]
    cost: low

  - id: ebs-default-encryption
    name: EBS Account-Level Default Encryption
    description: |
      Enable EBS default encryption at the account level to ensure all
      newly created volumes and snapshots are automatically encrypted
      using a specified KMS key.
    control_functions: [preventive]
    cost: low

  - id: ebs-snapshot-access-control
    name: EBS Snapshot Cross-Account Access Control
    description: |
      Restrict EBS snapshot sharing to authorized accounts using IAM
      policies and SCP guardrails. Use KMS key policies to control
      decryption access for shared encrypted snapshots.
    control_functions: [preventive]
    cost: low

  - id: ebs-direct-api-restriction
    name: EBS Direct API Access Restriction
    description: |
      Restrict access to EBS Direct APIs (ebs:GetSnapshotBlock,
      ebs:ListSnapshotBlocks) via IAM policies, limiting programmatic
      snapshot data access to authorized automation roles only.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # CloudFormation Countermeasures
  # ============================================================================
  - id: cloudformation-template-validation
    name: CloudFormation Template Validation and Review
    description: |
      Validate CloudFormation templates using cfn-lint, cfn-nag, or Checkov before
      deployment. Enforce template review through change sets and approval workflows.
    control_functions: [preventive]
    cost: low

  - id: cloudformation-least-privilege-role
    name: CloudFormation Least-Privilege Stack Role
    description: |
      Create dedicated IAM roles for CloudFormation stacks scoped to only the
      resource types and actions required by each template.
    control_functions: [preventive]
    cost: medium

  - id: cloudformation-drift-detection
    name: CloudFormation Drift Detection
    description: |
      Enable periodic drift detection on CloudFormation stacks and alert on
      detected drift to identify untracked manual changes to managed resources.
    control_functions: [detective]
    cost: low

  - id: cloudformation-no-secrets-in-outputs
    name: Avoid Secrets in CloudFormation Outputs
    description: |
      Use dynamic references to Secrets Manager or SSM SecureString parameters
      instead of embedding sensitive values in template parameters or outputs.
      Enable NoEcho on sensitive parameters.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # CodePipeline/CodeBuild Countermeasures
  # ============================================================================
  - id: codepipeline-source-integrity
    name: Pipeline Source Integrity Verification
    description: |
      Enable branch protection, require signed commits, and use CodeStar
      Connections with restricted repository access to prevent unauthorized
      changes to pipeline source inputs.
    control_functions: [preventive]
    cost: medium

  - id: codebuild-no-secrets-in-logs
    name: CodeBuild Secret Protection
    description: |
      Store secrets in Secrets Manager or SSM SecureString, never in plaintext
      environment variables. Disable build log output for sensitive steps.
    control_functions: [preventive]
    cost: low

  - id: codepipeline-artifact-encryption
    name: Pipeline Artifact Encryption
    description: |
      Encrypt pipeline artifacts at rest using KMS customer-managed keys.
      Use artifact checksums or code signing to verify integrity between stages.
    control_functions: [preventive]
    cost: low

  - id: codebuild-least-privilege-role
    name: CodeBuild Least-Privilege Service Role
    description: |
      Scope CodeBuild service roles to only the AWS resources and actions
      required for the build. Avoid reusing broad deployment roles for builds.
    control_functions: [preventive]
    cost: medium

  # ============================================================================
  # Elastic Beanstalk Countermeasures
  # ============================================================================
  - id: beanstalk-private-environment
    name: Beanstalk Private Environment Configuration
    description: |
      Deploy Elastic Beanstalk environments in private VPC subnets with
      internal load balancers where public access is not required.
    control_functions: [preventive]
    cost: low

  - id: beanstalk-managed-updates
    name: Beanstalk Managed Platform Updates
    description: |
      Enable managed platform updates to automatically apply patches and
      platform version upgrades during maintenance windows.
    control_functions: [preventive]
    cost: low

  - id: beanstalk-least-privilege-profile
    name: Beanstalk Least-Privilege Instance Profile
    description: |
      Create custom instance profiles for Beanstalk environments scoped to
      only the AWS resources the application requires, replacing the default
      overly permissive profile.
    control_functions: [preventive]
    cost: medium

  # ============================================================================
  # SSM Countermeasures
  # ============================================================================
  - id: ssm-securestring-parameters
    name: SSM SecureString Parameters
    description: |
      Store sensitive configuration values as SecureString parameters encrypted
      with KMS customer-managed keys. Enforce parameter policies for expiration
      and notification on sensitive parameters.
    control_functions: [preventive]
    cost: low

  - id: ssm-session-manager-controls
    name: Session Manager Access Controls
    description: |
      Restrict Session Manager access through IAM policies with conditions on
      target instance tags. Enable session logging to S3 and CloudWatch for
      audit. Enforce encrypted sessions with KMS.
    control_functions: [preventive]
    cost: low

  - id: ssm-run-command-restrictions
    name: SSM Run Command Restrictions
    description: |
      Limit SendCommand permissions to specific documents and target instances
      using IAM conditions. Log all command executions and outputs to S3 or
      CloudWatch for audit.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # GuardDuty Countermeasures
  # ============================================================================
  - id: guardduty-enable-all-regions
    name: Enable GuardDuty in All Regions
    description: |
      Enable GuardDuty across all AWS regions and all accounts in the
      organization. Use delegated administrator for centralized management.
    control_functions: [detective]
    cost: low

  - id: guardduty-automated-response
    name: GuardDuty Automated Threat Response
    description: |
      Route GuardDuty findings to EventBridge with automated response actions
      for high-severity findings (isolate instance, revoke credentials, notify
      security team). Suppress only after documented review.
    control_functions: [detective]
    cost: medium

  - id: guardduty-full-protection
    name: GuardDuty Full Protection Features
    description: |
      Enable all GuardDuty protection features: S3 protection, RDS login
      activity monitoring, Lambda network activity monitoring, EKS audit log
      monitoring, EC2 runtime monitoring, and malware scanning.
    control_functions: [detective]
    cost: medium

  # ============================================================================
  # Config Countermeasures
  # ============================================================================
  - id: config-enable-all-regions
    name: Enable AWS Config in All Regions
    description: |
      Enable AWS Config recording for all resource types across all regions
      and accounts. Use an aggregator for centralized compliance visibility.
    control_functions: [detective]
    cost: low

  - id: config-conformance-packs
    name: AWS Config Conformance Packs
    description: |
      Deploy conformance packs with managed rules covering security best
      practices (CIS, FSBP, PCI-DSS). Add custom rules for organization-specific
      requirements.
    control_functions: [detective]
    cost: medium

  - id: config-auto-remediation
    name: Config Automatic Remediation
    description: |
      Attach SSM Automation remediation actions to non-compliant Config rule
      evaluations for automatic correction of common misconfigurations.
    control_functions: [corrective]
    cost: medium

  # ============================================================================
  # ElastiCache Countermeasures
  # ============================================================================
  - id: elasticache-auth-token
    name: Enable ElastiCache AUTH Token
    description: |
      Require AUTH token for Redis connections to prevent unauthenticated
      access to cached data.
    control_functions: [preventive]
    cost: low

  - id: elasticache-encryption-in-transit
    name: Enable ElastiCache In-Transit Encryption
    description: |
      Enable TLS for data in transit between application clients and
      ElastiCache nodes.
    control_functions: [preventive]
    cost: low

  - id: elasticache-encryption-at-rest
    name: Enable ElastiCache At-Rest Encryption
    description: |
      Enable encryption at rest using KMS to protect cached data on
      persistent storage and snapshots.
    control_functions: [preventive]
    cost: low

  - id: elasticache-private-subnet
    name: Deploy ElastiCache in Private Subnets
    description: |
      Deploy ElastiCache clusters in private subnets with restrictive
      security groups to prevent direct internet access.
    control_functions: [preventive]
    cost: low

  - id: elasticache-snapshot-encryption
    name: Encrypt ElastiCache Snapshots
    description: |
      Ensure ElastiCache snapshots are encrypted and access is restricted
      to authorized accounts.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # Redshift Countermeasures
  # ============================================================================
  - id: redshift-no-public-access
    name: Disable Redshift Public Accessibility
    description: |
      Disable public accessibility on Redshift clusters to prevent direct
      internet access to the data warehouse.
    control_functions: [preventive]
    cost: low

  - id: redshift-encryption-at-rest
    name: Enable Redshift Encryption at Rest
    description: |
      Enable at-rest encryption on Redshift clusters using KMS to protect
      stored data.
    control_functions: [preventive]
    cost: low

  - id: redshift-audit-logging
    name: Enable Redshift Audit Logging
    description: |
      Enable Redshift audit logging to track user activity, query execution,
      and connection attempts.
    control_functions: [detective]
    cost: low

  - id: redshift-spectrum-least-privilege
    name: Restrict Redshift Spectrum IAM Role
    description: |
      Scope the Redshift Spectrum IAM role to specific S3 buckets and
      prefixes required for queries.
    control_functions: [preventive]
    cost: low

