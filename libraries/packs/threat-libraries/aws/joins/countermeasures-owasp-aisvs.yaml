framework: owasp-aisvs-1-0

mappings:
  # ============================================================================
  # Bedrock / LLM Countermeasures → AISVS
  # ============================================================================

  # C2 - Input Validation and Sanitization
  - countermeasure: bedrock-input-validation
    requirements:
      - "2.1.1"    # Input normalization before tokenization or embedding
      - "2.1.2"    # Encoding and representation smuggling detection
      - "2.1.3"    # Prompt injection detection ruleset/classifier
      - "2.1.5"    # Character set restriction (allowlist approach)
      - "2.1.6"    # Instruction hierarchy enforcement
    sufficiency: full

  # C2 + C7 - Guardrails cover both input and output
  - countermeasure: bedrock-guardrails
    requirements:
      - "2.1.3"    # Prompt injection detection
      - "2.1.4"    # Multi-layered prompt injection defense
      - "7.1.1"    # Output schema validation
      - "7.3.1"    # Safety classifiers scan every response
      - "7.2.1"    # Unsafe/biased output detected and blocked
    sufficiency: full

  # C7 - Output Safety
  - countermeasure: bedrock-output-filtering
    requirements:
      - "7.1.1"    # Output schema validation
      - "7.1.2"    # Structured output parsing before downstream use
      - "7.3.1"    # Safety classifiers scan every response
      - "5.2.4"    # Post-inference filtering prevents unauthorized data
    sufficiency: full

  # C8 - Data Protection
  - countermeasure: bedrock-data-masking
    requirements:
      - "8.2.1"    # Sensitive fields detected before embedding and masked
      - "8.2.2"    # PII redaction or differential privacy before model training
      - "5.2.3"    # Sensitive data retrieved via pipelines to prevent permanent storage
    sufficiency: full

  # C12 - Logging and Monitoring
  - countermeasure: bedrock-model-invocation-logging
    requirements:
      - "12.1.1"   # AI interactions logged with session context and telemetry
      - "12.1.3"   # Structured schema: model ID, token usage, provider
      - "12.3.1"   # AI-specific metrics (token usage, latency, error rates)
    sufficiency: full

  # C3 - Model Lifecycle
  - countermeasure: bedrock-vpc-endpoint
    requirements:
      - "3.3.1"    # Model artifacts (weights, configs, tokenizers) stored in access-controlled repos
    sufficiency: partial

  # C9 - Agent and Autonomy
  - countermeasure: bedrock-token-budget
    requirements:
      - "9.2.1"    # Maximum token/cost budget per agentic task
      - "9.2.2"    # Execution timeout per agentic session
    sufficiency: full

  # ============================================================================
  # RAG / OpenSearch Countermeasures → AISVS
  # ============================================================================

  # C5 - Access Control
  - countermeasure: rag-access-control
    requirements:
      - "5.2.1"    # AI resources enforce access controls with default-deny
      - "5.2.2"    # RAG/embedding pipelines enforce end-user authorization
    sufficiency: full

  # C1 + C8 - Data Governance and Protection
  - countermeasure: rag-data-sanitization
    requirements:
      - "1.2.1"    # Data sources catalogued with sensitivity classification
      - "1.2.3"    # Sensitive information in labels redacted/anonymized
      - "8.1.1"    # Data classification policy for AI training and inference
    sufficiency: partial

  # C8 - Data Protection
  - countermeasure: opensearch-encryption
    requirements:
      - "8.1.2"    # Encryption at rest for all AI data stores
    sufficiency: full

  - countermeasure: opensearch-access-policy
    requirements:
      - "5.2.1"    # AI resources enforce access controls with default-deny
    sufficiency: full

  # ============================================================================
  # Cognito Countermeasures → AISVS
  # ============================================================================

  # C5 - Authentication
  - countermeasure: cognito-mfa
    requirements:
      - "5.1.1"    # Step-up authentication for high-risk AI operations
    sufficiency: partial

  - countermeasure: cognito-advanced-security
    requirements:
      - "5.1.1"    # Step-up authentication for high-risk AI operations
      - "5.1.2"    # AI agents authenticate with short-lived minimal-scoped tokens
    sufficiency: partial

  # ============================================================================
  # WAF Countermeasures → AISVS
  # ============================================================================

  # C2 - Input Validation
  - countermeasure: waf-managed-rules
    requirements:
      - "2.1.1"    # Input normalization
      - "2.1.5"    # Character set restriction
    sufficiency: partial

  # ============================================================================
  # CloudWatch Countermeasures → AISVS
  # ============================================================================

  # C12 - Logging and Monitoring
  - countermeasure: cloudwatch-alarm
    requirements:
      - "12.2.1"   # Anomaly and drift detection for AI system behavior
      - "12.3.1"   # AI-specific metrics dashboards
    sufficiency: partial

  # ==========================================================================
  # Batch 3: AI/ML Expansion (SageMaker, Bedrock Agents, Knowledge Bases)
  # ==========================================================================

  # SageMaker
  - countermeasure: sagemaker-vpc-isolation
    requirements:
      - "8.1.1"
    sufficiency: partial

  - countermeasure: sagemaker-training-data-protection
    requirements:
      - "12.1.1"
    sufficiency: partial

  - countermeasure: sagemaker-endpoint-auth
    requirements:
      - "4.1.1"
    sufficiency: partial

  # Bedrock Agents
  - countermeasure: bedrock-agent-input-validation
    requirements:
      - "9.2.1"
    sufficiency: partial

  - countermeasure: bedrock-agent-least-privilege
    requirements:
      - "9.2.1"
    sufficiency: partial

  - countermeasure: bedrock-agent-role-restriction
    requirements:
      - "9.1.1"
    sufficiency: partial

  - countermeasure: bedrock-agent-guardrails
    requirements:
      - "3.5.1"
    sufficiency: partial

  # Bedrock Knowledge Bases
  - countermeasure: bedrock-kb-data-source-validation
    requirements:
      - "5.1.1"
    sufficiency: partial

  - countermeasure: bedrock-kb-scoped-sync
    requirements:
      - "5.2.1"
    sufficiency: partial

  - countermeasure: bedrock-kb-access-control
    requirements:
      - "5.2.1"
    sufficiency: partial

  - countermeasure: bedrock-kb-sensitive-data-exclusion
    requirements:
      - "5.1.1"
    sufficiency: partial
