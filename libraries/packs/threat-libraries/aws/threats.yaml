threats:
  # ============================================================================
  # S3 Threats
  # ============================================================================
  - id: s3-public-exposure
    name: S3 Bucket Public Exposure
    description: |
      S3 bucket is publicly accessible, exposing sensitive data to unauthorized users.
      This can occur through misconfigured bucket policies, ACLs, or disabled Block Public Access.

  - id: s3-data-tampering
    name: S3 Object Tampering
    description: |
      Unauthorized modification of S3 objects due to misconfigured permissions.
      Attackers may alter data, inject malicious content, or corrupt backups.

  - id: s3-deletion
    name: S3 Data Deletion
    description: |
      Malicious or accidental deletion of S3 objects without proper versioning or MFA delete.
      Can lead to permanent data loss and service disruption.

  # ============================================================================
  # Lambda Threats
  # ============================================================================
  - id: lambda-injection
    name: Lambda Code Injection
    description: |
      Malicious input exploits Lambda function leading to code execution.
      Includes SQL injection, command injection, or template injection attacks.

  - id: lambda-privilege-escalation
    name: Lambda Role Over-Privileged
    description: |
      Lambda execution role has excessive permissions enabling privilege escalation.
      Compromised function could access resources beyond its intended scope.

  - id: lambda-secret-exposure
    name: Lambda Environment Variable Exposure
    description: |
      Sensitive data (API keys, credentials) stored in Lambda environment variables
      may be exposed through logs, error messages, or function enumeration.

  - id: lambda-dos
    name: Lambda Resource Exhaustion
    description: |
      Attacker triggers excessive Lambda invocations causing throttling, high costs,
      or denial of service to legitimate users.

  # ============================================================================
  # API Gateway Threats
  # ============================================================================
  - id: apigw-unauthorized-access
    name: API Gateway Unauthorized Access
    description: |
      API endpoints accessible without proper authentication, allowing unauthorized
      access to backend services and data.

  - id: apigw-injection
    name: API Gateway Input Injection
    description: |
      Malicious payloads passed through API Gateway to backend services,
      exploiting insufficient input validation.

  - id: apigw-rate-limit-bypass
    name: API Gateway Rate Limit Bypass
    description: |
      Attacker bypasses API throttling through distributed requests or
      exploiting misconfigured rate limiting, causing backend overload.

  - id: apigw-logging-gap
    name: API Gateway Insufficient Logging
    description: |
      Lack of comprehensive API logging prevents detection of attacks,
      unauthorized access attempts, and security incident investigation.

  # ============================================================================
  # DynamoDB Threats
  # ============================================================================
  - id: dynamodb-unauthorized-access
    name: DynamoDB Unauthorized Table Access
    description: |
      IAM policies allow broader access to DynamoDB tables than required,
      enabling unauthorized data reads or modifications.

  - id: dynamodb-injection
    name: DynamoDB Query Injection
    description: |
      Malicious input manipulates DynamoDB queries through improperly
      constructed filter expressions or condition expressions.

  - id: dynamodb-capacity-exhaustion
    name: DynamoDB Capacity Exhaustion
    description: |
      Attacker consumes provisioned throughput capacity through excessive
      requests, causing throttling for legitimate users.

  # ============================================================================
  # SQS Threats
  # ============================================================================
  - id: sqs-message-tampering
    name: SQS Message Tampering
    description: |
      Unauthorized modification of messages in transit or at rest,
      potentially altering application behavior or injecting malicious payloads.

  - id: sqs-message-injection
    name: SQS Malicious Message Injection
    description: |
      Attacker injects unauthorized messages into the queue, potentially
      triggering unintended actions in consuming applications.

  - id: sqs-queue-flooding
    name: SQS Queue Flooding
    description: |
      Excessive messages sent to queue causing processing delays, increased
      costs, and potential denial of service to consumers.

  # ============================================================================
  # Data Flow Threats (apply to connections between components)
  # ============================================================================
  - id: dataflow-mitm
    name: Man-in-the-Middle Attack
    description: |
      Attacker intercepts and potentially modifies data in transit between
      components. Can lead to data theft, tampering, or credential capture.

  - id: dataflow-eavesdropping
    name: Data Eavesdropping
    description: |
      Unauthorized interception and reading of data transmitted between
      components, exposing sensitive information to attackers.

  - id: dataflow-replay-attack
    name: Replay Attack
    description: |
      Attacker captures legitimate requests and re-transmits them to perform
      unauthorized actions or duplicate transactions.

  - id: dataflow-injection
    name: Data Injection in Transit
    description: |
      Malicious data injected into the communication channel between components,
      potentially exploiting downstream systems or corrupting data.

  # ============================================================================
  # Bedrock / LLM Threats
  # ============================================================================
  - id: bedrock-prompt-injection
    name: LLM Prompt Injection
    description: |
      Attacker crafts input that manipulates the LLM's behavior by injecting
      instructions into prompts. Includes direct injection (user input) and
      indirect injection (via RAG context, tool outputs, or other data sources).
      Can cause the model to ignore system instructions, exfiltrate data, or
      perform unauthorized actions.

  - id: bedrock-jailbreak
    name: LLM Jailbreak
    description: |
      Attacker bypasses model safety guardrails and content filters through
      adversarial prompting techniques. Enables generation of harmful content,
      policy-violating responses, or disclosure of system prompts.

  - id: bedrock-data-leakage
    name: LLM Data Leakage
    description: |
      Sensitive data (PII, credentials, cardholder data, internal configurations)
      leaked through LLM responses. Can occur via training data memorization,
      RAG context inclusion, or insufficient output filtering.

  - id: bedrock-sensitive-data-in-prompt
    name: Sensitive Data Exposure in Prompts
    description: |
      Cardholder data, PII, or other sensitive information sent to the LLM in
      prompts or RAG context without tokenization or masking. Data may be logged,
      cached, or used for model improvement by the provider.

  - id: bedrock-model-abuse
    name: LLM Resource Abuse
    description: |
      Unauthorized or excessive model invocations causing financial impact through
      high token consumption, denial of service to legitimate users, or abuse of
      model capabilities for malicious purposes (spam, phishing content generation).

  # ============================================================================
  # RAG / OpenSearch Serverless Threats
  # ============================================================================
  - id: rag-poisoning
    name: RAG Knowledge Base Poisoning
    description: |
      Attacker injects malicious or manipulated content into the RAG knowledge base
      (vector store). Poisoned documents influence model outputs, enabling indirect
      prompt injection, misinformation, or targeted manipulation of responses.

  - id: rag-unauthorized-retrieval
    name: RAG Unauthorized Document Retrieval
    description: |
      RAG pipeline retrieves and includes documents in the model context that the
      requesting user is not authorized to access. Occurs when document-level access
      controls are not enforced during semantic search.

  - id: opensearch-data-exfiltration
    name: Vector Store Data Exfiltration
    description: |
      Vector embeddings in OpenSearch Serverless are exploited to reconstruct or
      infer sensitive source data. Attackers with read access to embeddings can
      reverse-engineer original text content or identify sensitive patterns.

  # ============================================================================
  # Cognito Threats
  # ============================================================================
  - id: cognito-token-theft
    name: Cognito Token Theft
    description: |
      Stolen or forged Cognito JWT tokens used for unauthorized access to
      protected resources. Tokens intercepted via XSS, insecure storage, or
      man-in-the-middle attacks on token endpoints.

  - id: cognito-account-takeover
    name: Cognito Account Takeover
    description: |
      Attacker gains control of user accounts through credential stuffing, weak
      password policies, or social engineering. Compromised accounts provide
      legitimate access to AI-powered services and sensitive data.

  # ============================================================================
  # WAF Threats
  # ============================================================================
  - id: waf-bypass
    name: WAF Rule Bypass
    description: |
      Attacker circumvents WAF rules through encoding tricks, payload fragmentation,
      or exploiting gaps in rule coverage. Bypassed WAF allows malicious requests
      to reach backend services including AI endpoints.

  # ============================================================================
  # CloudWatch Threats
  # ============================================================================
  - id: cloudwatch-log-injection
    name: CloudWatch Log Injection
    description: |
      Attacker injects crafted data into application logs stored in CloudWatch,
      creating misleading entries that obscure attacks, trigger false alarms,
      or exploit log analysis tools.

  # ============================================================================
  # IAM Threats
  # ============================================================================
  - id: iam-overprivileged-policy
    name: IAM Overly Permissive Policy
    description: |
      IAM policies grant wildcard administrative privileges or overly broad
      permissions, enabling users or roles to access resources beyond their
      intended scope. Compromised credentials with excessive permissions
      amplify the blast radius of any breach.

  - id: iam-stale-credentials
    name: IAM Stale or Unused Credentials
    description: |
      IAM user access keys or console credentials remain active long after
      they are no longer needed or after the user has left the organization.
      Stale credentials are prime targets for credential theft and provide
      persistent unauthorized access.

  - id: iam-root-user-abuse
    name: IAM Root User Abuse
    description: |
      The AWS root user account is used for routine operations or retains
      active access keys. Root credentials cannot be scoped with IAM policies
      and provide unrestricted access to all resources and billing, making
      compromise catastrophic.

  - id: iam-missing-mfa
    name: IAM Missing Multi-Factor Authentication
    description: |
      IAM users or the root account lack multi-factor authentication,
      allowing account compromise through credential theft alone. Without
      MFA, stolen passwords or leaked access keys provide full access
      to the associated permissions.

  - id: iam-weak-password-policy
    name: IAM Weak Password Policy
    description: |
      The IAM account password policy does not enforce sufficient complexity,
      length, rotation, or reuse restrictions. Weak password policies enable
      brute-force and credential stuffing attacks against console access.

  - id: iam-cross-account-escalation
    name: IAM Cross-Account Role Assumption Abuse
    description: |
      Overly permissive trust policies on IAM roles allow unintended
      cross-account access. An attacker who compromises one account can
      assume roles in other accounts, enabling lateral movement across
      the organization's AWS environment.

  - id: iam-policy-drift
    name: IAM Undetected Permission Drift
    description: |
      Without IAM Access Analyzer, external access grants and permission
      changes go undetected. Resource policies may inadvertently allow
      access from external accounts or public principals, creating
      hidden exposure that persists until manually discovered.

  # ============================================================================
  # KMS Threats
  # ============================================================================
  - id: kms-unrestricted-decrypt
    name: KMS Unrestricted Decryption Access
    description: |
      IAM policies allow kms:Decrypt or kms:ReEncryptFrom actions on all
      KMS keys rather than specific keys. An attacker with these broad
      permissions can decrypt data protected by any customer-managed key
      in the account.

  - id: kms-key-deletion
    name: KMS Key Scheduled for Deletion
    description: |
      A KMS key is scheduled for deletion, which if completed makes all
      data encrypted under that key permanently unrecoverable. Malicious
      or accidental key deletion can cause catastrophic, irreversible
      data loss.

  - id: kms-no-key-rotation
    name: KMS Key Rotation Not Enabled
    description: |
      Customer-managed KMS keys do not have automatic key rotation enabled.
      Without rotation, a compromised key material remains in use
      indefinitely, expanding the window of exposure for encrypted data.

  - id: kms-public-key-policy
    name: KMS Key Policy Allows Public Access
    description: |
      A KMS key policy grants access to external or anonymous principals.
      A publicly accessible key allows unauthorized parties to encrypt or
      decrypt data, undermining the confidentiality of all data protected
      by that key.

  # ============================================================================
  # VPC Threats
  # ============================================================================
  - id: vpc-unrestricted-ingress
    name: Unrestricted Security Group Ingress
    description: |
      Security groups allow unrestricted inbound access (0.0.0.0/0) to sensitive
      ports such as SSH (22), RDP (3389), or database ports. Exposes internal
      services to the public internet and enables reconnaissance, brute-force
      attacks, and unauthorized access.

  - id: vpc-missing-flow-logs
    name: Missing VPC Flow Logs
    description: |
      VPC flow logging is not enabled, preventing visibility into accepted and
      rejected network traffic. Without flow logs, detection of unauthorized
      access attempts, data exfiltration, and lateral movement is severely limited.

  - id: vpc-public-subnet-exposure
    name: Public Subnet Exposure
    description: |
      Resources are deployed in public subnets with auto-assigned public IPs,
      exposing them directly to the internet. Increases attack surface and enables
      direct exploitation of vulnerable services without requiring the attacker
      to traverse network controls.

  - id: vpc-default-security-group
    name: Default Security Group Misconfiguration
    description: |
      The VPC default security group retains its default permissive rules (allow
      all inbound from group members, allow all outbound). Resources inadvertently
      associated with the default security group inherit overly permissive access.

  - id: vpc-missing-network-segmentation
    name: Missing Network Segmentation
    description: |
      Workloads with different trust levels share the same subnet or security
      group without proper network segmentation. A compromised resource can
      access other resources in the same network segment, enabling lateral movement.

  # ============================================================================
  # EC2 Threats
  # ============================================================================
  - id: ec2-imdsv1-credential-theft
    name: EC2 IMDSv1 Credential Theft
    description: |
      Instance Metadata Service Version 1 (IMDSv1) allows unauthenticated HTTP
      requests to retrieve instance metadata including IAM role temporary credentials.
      Attackers exploit SSRF vulnerabilities in applications to reach the metadata
      endpoint and steal credentials for privilege escalation.

  - id: ec2-public-instance-exposure
    name: EC2 Public Instance Exposure
    description: |
      EC2 instances have public IPv4 addresses or are launched in public subnets,
      making them directly reachable from the internet. Exposed instances are
      vulnerable to port scanning, brute-force attacks, and exploitation of
      unpatched services.

  - id: ec2-unencrypted-ebs
    name: Unencrypted EBS Volumes
    description: |
      EBS volumes attached to EC2 instances are not encrypted at rest. Data on
      unencrypted volumes can be exposed through snapshot sharing, volume detachment
      and reattachment to another instance, or physical media theft.

  - id: ec2-overprivileged-instance-profile
    name: Overprivileged EC2 Instance Profile
    description: |
      EC2 instance IAM role has excessive permissions beyond what the workload
      requires. If the instance is compromised via SSRF, RCE, or credential theft,
      the attacker inherits all permissions of the overprivileged role, enabling
      access to unrelated AWS resources.

  - id: ec2-unpatched-instances
    name: Unpatched EC2 Instances
    description: |
      EC2 instances run outdated operating systems or software with known
      vulnerabilities. Without automated patch management, instances accumulate
      exploitable vulnerabilities that attackers use for initial access or
      privilege escalation.

  - id: ec2-unrestricted-outbound
    name: EC2 Unrestricted Outbound Access
    description: |
      Security groups allow unrestricted outbound traffic from EC2 instances.
      Compromised instances can freely communicate with attacker-controlled
      infrastructure for command and control, data exfiltration, or lateral
      movement to other networks.

  # ============================================================================
  # ELB Threats
  # ============================================================================
  - id: elb-unencrypted-listener
    name: ELB Unencrypted Listener
    description: |
      Load balancer listeners accept HTTP traffic without TLS encryption or fail
      to redirect HTTP to HTTPS. Data transmitted between clients and the load
      balancer is exposed to eavesdropping and tampering.

  - id: elb-missing-waf
    name: ELB Missing WAF Association
    description: |
      Application Load Balancer is not associated with an AWS WAF web ACL.
      Without WAF protection, the ALB forwards malicious requests (SQL injection,
      XSS, bot traffic) directly to backend targets.

  - id: elb-missing-access-logs
    name: ELB Access Logging Disabled
    description: |
      Load balancer access logging is not enabled. Without access logs, security
      teams cannot investigate suspicious traffic patterns, identify attack sources,
      or perform forensic analysis after incidents.

  - id: elb-weak-tls-policy
    name: ELB Weak TLS Security Policy
    description: |
      Load balancer uses a deprecated or weak SSL/TLS security policy that allows
      older protocol versions or weak cipher suites. Enables protocol downgrade
      attacks and increases risk of traffic decryption.

  - id: elb-http-desync
    name: ELB HTTP Desync Attack
    description: |
      Application Load Balancer does not use defensive or strictest desync
      mitigation mode. HTTP desync vulnerabilities enable request smuggling,
      allowing attackers to bypass security controls, poison caches, or hijack
      responses from other users.

  # ============================================================================
  # RDS / Aurora Threats
  # ============================================================================
  - id: rds-public-exposure
    name: RDS Instance Public Exposure
    description: |
      RDS database instance is publicly accessible with a public IP address, exposing the
      database to direct internet access. Combined with weak credentials or unpatched
      vulnerabilities, this enables unauthorized data access or database compromise.

  - id: rds-snapshot-leak
    name: RDS Snapshot Data Leak
    description: |
      RDS snapshots shared publicly or across untrusted accounts expose the full database
      contents. Public snapshots are accessible to all AWS accounts, enabling bulk data
      exfiltration without needing database credentials.

  - id: rds-unencrypted-storage
    name: RDS Unencrypted Data at Rest
    description: |
      RDS instance or cluster storage is not encrypted, leaving database contents, automated
      backups, and snapshots readable if underlying storage is compromised or snapshots are
      shared across accounts.

  - id: rds-unencrypted-transit
    name: RDS Unencrypted Data in Transit
    description: |
      Database connections do not enforce TLS encryption, allowing eavesdropping on queries,
      results, and credentials between application tier and database. Especially critical
      when traffic crosses VPC boundaries or availability zones.

  - id: rds-credential-abuse
    name: RDS Credential Compromise
    description: |
      Static database credentials (username/password) stored in application code, configuration
      files, or environment variables are compromised, granting direct database access. Default
      or commonly guessed administrator usernames increase attack surface.

  - id: rds-missing-audit-logging
    name: RDS Insufficient Audit Logging
    description: |
      Database audit logging is not enabled or logs are not published to CloudWatch Logs,
      preventing detection of unauthorized queries, privilege escalation attempts, or data
      exfiltration through the database layer.

  - id: rds-deletion-data-loss
    name: RDS Accidental or Malicious Deletion
    description: |
      RDS instance or cluster is deleted without deletion protection, or automated backups
      are insufficient for recovery. Compromised credentials with delete permissions or
      accidental operations can cause permanent data loss.

  # ============================================================================
  # CloudTrail Threats
  # ============================================================================
  - id: cloudtrail-disabled
    name: CloudTrail Trail Disabled or Deleted
    description: |
      Attacker disables or deletes CloudTrail trails to eliminate audit evidence of their
      activity. Without active trails, API calls for credential theft, resource modification,
      and data exfiltration go unrecorded.

  - id: cloudtrail-log-tampering
    name: CloudTrail Log Tampering
    description: |
      CloudTrail log files in S3 are modified or deleted to conceal attacker activity. Without
      log file validation enabled, tampering is undetectable. Publicly accessible log buckets
      compound this by enabling external modification.

  - id: cloudtrail-blind-spots
    name: CloudTrail Coverage Gaps
    description: |
      CloudTrail is not configured as multi-region or does not capture all management event
      types (read and write), creating blind spots where attacker activity in certain regions
      or event categories goes unrecorded.

  - id: cloudtrail-no-alerting
    name: CloudTrail Missing Real-Time Alerting
    description: |
      CloudTrail logs are delivered to S3 but not integrated with CloudWatch Logs, preventing
      real-time detection of security events. Suspicious API activity (root login, IAM policy
      changes, security group modifications) goes unnoticed until manual log review.

  # ============================================================================
  # Batch 2: Containers, Secrets, Edge, DNS
  # ============================================================================

  # ============================================================================
  # ECS Threats
  # ============================================================================
  - id: ecs-privileged-container
    name: ECS Privileged Container Execution
    description: |
      ECS task definitions allow containers to run in privileged mode, granting
      full access to the host kernel and devices. A compromised privileged container
      can escape to the underlying EC2 host, access other containers, and pivot
      to other resources in the VPC.

  - id: ecs-host-namespace-sharing
    name: ECS Host Namespace Sharing
    description: |
      ECS task definitions configured to share the host PID or network namespace
      break container isolation. Containers sharing the host PID namespace can
      inspect and signal host processes. Sharing the host network namespace exposes
      the host's network interfaces and ports.

  - id: ecs-secrets-in-env
    name: ECS Secrets Stored in Environment Variables
    description: |
      Sensitive data (database credentials, API keys, tokens) stored as plaintext
      environment variables in ECS task definitions. Task definition history and
      container inspection expose these values to anyone with describe permissions.

  - id: ecs-public-task-ip
    name: ECS Fargate Task Public IP Exposure
    description: |
      ECS Fargate tasks assigned public IP addresses are directly reachable from
      the internet. Exposed tasks increase the attack surface and can be targeted
      for exploitation of application vulnerabilities or container escape.

  - id: ecs-missing-logging
    name: ECS Container Logging Not Configured
    description: |
      ECS task definitions lack log configuration (awslogs, splunk, or other log
      drivers). Without centralized logging, container activity, errors, and
      security events go unrecorded, preventing incident detection and forensics.

  - id: ecs-readonly-root-disabled
    name: ECS Container Writable Root Filesystem
    description: |
      ECS containers run with a writable root filesystem, allowing attackers who
      gain code execution to modify binaries, install tools, create persistence
      mechanisms, or tamper with application files within the container.

  # ============================================================================
  # EKS Threats
  # ============================================================================
  - id: eks-public-endpoint
    name: EKS Public Cluster Endpoint
    description: |
      The EKS cluster API server endpoint is publicly accessible from the internet.
      Attackers can attempt authentication brute-force, exploit Kubernetes API
      vulnerabilities, or abuse leaked credentials to control the cluster.

  - id: eks-unsupported-version
    name: EKS Unsupported Kubernetes Version
    description: |
      EKS cluster runs a Kubernetes version that is past end-of-support, missing
      security patches and bug fixes. Unsupported versions accumulate known
      vulnerabilities that attackers can exploit for cluster compromise.

  - id: eks-unencrypted-secrets
    name: EKS Secrets Not Encrypted at Rest
    description: |
      Kubernetes secrets stored in etcd are not encrypted with a KMS envelope
      encryption key. Anyone with etcd access or an etcd backup can read all
      secrets (database passwords, TLS certificates, API tokens) in plaintext.

  - id: eks-missing-audit-logging
    name: EKS Audit Logging Disabled
    description: |
      EKS control plane logging (audit, authenticator, controller manager, scheduler)
      is not enabled. Without audit logs, unauthorized API calls, RBAC escalation
      attempts, and suspicious workload deployments go undetected.

  - id: eks-overpermissive-rbac
    name: EKS Overly Permissive RBAC
    description: |
      Kubernetes RBAC roles or cluster roles grant excessive permissions such as
      wildcard verbs on all resources, or bind privileged roles to default service
      accounts. Compromised pods inherit broad cluster access enabling lateral
      movement and data exfiltration.

  # ============================================================================
  # ECR Threats
  # ============================================================================
  - id: ecr-mutable-tags
    name: ECR Mutable Image Tags
    description: |
      ECR repositories allow image tags to be overwritten, enabling supply chain
      attacks where a trusted tag (e.g. "latest", "v1.2.0") is replaced with a
      malicious image. Downstream services pulling by tag silently execute
      attacker-controlled code.

  - id: ecr-no-image-scanning
    name: ECR Image Scanning Not Enabled
    description: |
      ECR repositories do not have vulnerability scanning enabled (basic or enhanced).
      Container images with known CVEs in OS packages or application dependencies
      are deployed without detection.

  - id: ecr-no-lifecycle-policy
    name: ECR Missing Lifecycle Policy
    description: |
      ECR repositories lack lifecycle policies to expire old or untagged images.
      Stale images accumulate known vulnerabilities and consume storage. Older
      images may contain credentials or sensitive data from earlier builds.

  - id: ecr-unrestricted-access
    name: ECR Unrestricted Repository Access
    description: |
      ECR repository policies allow broad cross-account or public image pull access.
      Unauthorized parties can pull proprietary container images, reverse-engineer
      application code, or extract embedded secrets and configuration.

  # ============================================================================
  # Secrets Manager Threats
  # ============================================================================
  - id: secrets-manager-unrotated-secrets
    name: Secrets Manager Unrotated Secrets
    description: |
      Secrets stored in Secrets Manager are not configured for automatic rotation,
      allowing compromised credentials to remain valid indefinitely. Without rotation,
      the window of exposure from a credential leak extends until manual intervention.

  - id: secrets-manager-cross-account-access
    name: Secrets Manager Cross-Account Secret Access
    description: |
      Overly permissive resource policies on Secrets Manager secrets allow unintended
      cross-account access. An attacker who compromises a trusted external account
      can retrieve secrets without direct access to the owning account.

  - id: secrets-manager-no-cmk-encryption
    name: Secrets Manager Default Encryption Key
    description: |
      Secrets are encrypted with the AWS-managed key (aws/secretsmanager) instead of
      a customer-managed KMS key. The AWS-managed key cannot have its access restricted
      via key policy, limiting the ability to enforce encryption-based access controls
      and audit decryption operations separately.

  - id: secrets-manager-missing-resource-policy
    name: Secrets Manager Missing Resource Policy
    description: |
      Secrets lack resource-based policies, relying solely on IAM identity policies for
      access control. Without resource policies, it is harder to enforce deny conditions,
      restrict access to specific VPC endpoints, or limit which principals can retrieve
      secret values.

  - id: secrets-manager-deletion-without-recovery
    name: Secrets Manager Secret Deletion Without Recovery Window
    description: |
      A secret is deleted with an insufficient recovery window or force-deleted without
      a waiting period. Applications depending on the secret lose access, and if the
      secret value was not backed up, the credential is permanently lost.

  # ============================================================================
  # CloudFront Threats
  # ============================================================================
  - id: cloudfront-http-only-origin
    name: CloudFront HTTP-Only Origin Communication
    description: |
      CloudFront distribution is configured to communicate with the origin over
      HTTP only, without requiring HTTPS. Data transmitted between CloudFront edge
      locations and the origin server is exposed to eavesdropping and tampering on
      the backend connection.

  - id: cloudfront-missing-waf
    name: CloudFront Missing WAF Integration
    description: |
      CloudFront distribution is not associated with an AWS WAF web ACL. Without
      WAF protection, malicious requests (SQL injection, XSS, bot traffic, credential
      stuffing) pass through to the origin unfiltered.

  - id: cloudfront-default-certificate
    name: CloudFront Default SSL Certificate
    description: |
      CloudFront distribution uses the default CloudFront SSL certificate (*.cloudfront.net)
      instead of a custom SSL certificate. Users cannot verify the expected domain identity,
      and the distribution cannot serve content on custom domain names over HTTPS.

  - id: cloudfront-missing-access-logs
    name: CloudFront Access Logging Disabled
    description: |
      CloudFront access logging is not enabled. Without logs capturing viewer requests,
      edge locations, response codes, and cache behavior, security teams cannot detect
      abuse patterns, investigate incidents, or identify content scraping.

  - id: cloudfront-outdated-tls
    name: CloudFront Outdated TLS Protocol
    description: |
      CloudFront distribution allows connections using deprecated TLS protocol versions
      (TLS 1.0, TLS 1.1) or weak cipher suites. Enables protocol downgrade attacks and
      increases risk of traffic interception through known cryptographic weaknesses.

  - id: cloudfront-missing-oac
    name: CloudFront Missing Origin Access Control
    description: |
      CloudFront distribution does not use Origin Access Control (OAC) to restrict
      S3 origin access. Without OAC, the S3 bucket must be publicly accessible or use
      the legacy Origin Access Identity (OAI), which cannot support S3 SSE-KMS encryption
      or certain request types.

  # ============================================================================
  # Route 53 Threats
  # ============================================================================
  - id: route53-no-dnssec
    name: Route 53 DNSSEC Not Enabled
    description: |
      DNSSEC signing is not enabled on Route 53 public hosted zones. Without DNSSEC,
      DNS responses cannot be cryptographically validated by resolvers, making the domain
      vulnerable to DNS spoofing and cache poisoning attacks that redirect users to
      attacker-controlled infrastructure.

  - id: route53-no-query-logging
    name: Route 53 Query Logging Disabled
    description: |
      DNS query logging is not enabled for Route 53 hosted zones. Without query logs,
      security teams cannot detect DNS reconnaissance, domain enumeration, tunneling
      attempts, or anomalous query patterns that may indicate compromise.

  - id: route53-missing-transfer-lock
    name: Route 53 Domain Transfer Lock Missing
    description: |
      Domains registered with Route 53 do not have the transfer lock enabled. Without
      the transfer lock, an attacker who gains access to the registrar account or
      exploits social engineering can initiate a domain transfer to another registrar,
      hijacking the domain.

  - id: route53-hosted-zone-info-exposure
    name: Route 53 Hosted Zone Information Exposure
    description: |
      Public hosted zone records expose internal infrastructure details such as internal
      IP addresses, service names, or environment identifiers through DNS records (TXT,
      CNAME, SRV). Attackers use this information for reconnaissance and targeted attacks.

  # ==========================================================================
  # Batch 3: DevOps, Detection, Data, AI Expansion
  # ==========================================================================

  # SNS Threats
  - id: sns-topic-policy-exposure
    name: SNS Topic Policy Allows Unintended Publishers
    description: |
      Overly permissive SNS topic policy allows unauthorized principals to
      publish messages, enabling injection of malicious notifications into
      downstream subscribers including Lambda functions and SQS queues.

  - id: sns-unencrypted-messages
    name: SNS Messages Transmitted Without Encryption
    description: |
      SNS topics without server-side encryption expose message content at rest.
      Sensitive data in notifications can be accessed by anyone with read
      access to the underlying storage.

  - id: sns-http-subscription
    name: SNS Subscription Uses HTTP Instead of HTTPS
    description: |
      SNS subscriptions configured with HTTP endpoints transmit notification
      payloads in cleartext, enabling eavesdropping and message tampering
      on the delivery path.

  - id: sns-cross-account-access
    name: SNS Cross-Account Access Without Restrictions
    description: |
      SNS topic allows cross-account publish or subscribe without condition
      constraints, creating a data exfiltration or injection path across
      account trust boundaries.

  # EventBridge Threats
  - id: eventbridge-overpermissive-rules
    name: EventBridge Rules Route Events to Unintended Targets
    description: |
      Overly broad event patterns in EventBridge rules match more events than
      intended, routing sensitive data to unauthorized targets or triggering
      unintended downstream actions.

  - id: eventbridge-cross-account-bus
    name: EventBridge Cross-Account Event Bus Exposure
    description: |
      EventBridge event bus policy allows external accounts to put events,
      enabling injection of crafted events that trigger internal workflows
      or Lambda functions with attacker-controlled input.

  - id: eventbridge-missing-dlq
    name: EventBridge Failed Event Delivery Without Dead-Letter Queue
    description: |
      EventBridge rules without dead-letter queues silently drop failed event
      deliveries, causing data loss and masking downstream failures that
      could indicate an attack or misconfiguration.

  - id: eventbridge-unencrypted-bus
    name: EventBridge Custom Event Bus Without Encryption
    description: |
      Custom event buses without KMS encryption expose event payloads at rest,
      risking disclosure of sensitive data flowing through the event-driven
      architecture.

  # Step Functions Threats
  - id: stepfunctions-overprivileged-role
    name: Step Functions Execution Role With Excessive Permissions
    description: |
      State machine execution role has overly broad IAM permissions, allowing
      a compromised or maliciously crafted workflow to access resources beyond
      its intended scope through role chaining.

  - id: stepfunctions-missing-logging
    name: Step Functions Execution Logging Disabled
    description: |
      State machine executions without CloudWatch logging leave no audit trail
      of workflow steps, input/output data, or error conditions, hindering
      incident response and forensic investigation.

  - id: stepfunctions-state-data-exposure
    name: Step Functions State Data Contains Sensitive Information
    description: |
      Sensitive data (credentials, PII, tokens) passed between states in a
      workflow is persisted in execution history, exposing it to anyone with
      read access to the state machine history.

  # AppSync Threats
  - id: appsync-no-authorization
    name: AppSync API Without Authorization
    description: |
      AppSync GraphQL API with no authorization mode configured allows
      unauthenticated access to queries, mutations, and subscriptions,
      enabling unauthorized data retrieval and modification.

  - id: appsync-introspection-leak
    name: AppSync Schema Introspection Exposes Data Model
    description: |
      GraphQL introspection queries against AppSync reveal the complete API
      schema including types, fields, and relationships, providing attackers
      with a detailed map of the data model and potential attack surface.

  - id: appsync-missing-logging
    name: AppSync Request and Field-Level Logging Disabled
    description: |
      AppSync API without request-level and field-level logging provides no
      visibility into query patterns, failed authorization attempts, or
      resolver errors, preventing detection of abuse or data exfiltration.

  - id: appsync-missing-waf
    name: AppSync API Not Protected by WAF
    description: |
      AppSync API without WAF association is exposed to common web attacks
      including injection, excessive query depth, and batch query abuse
      that could overwhelm resolvers or extract unauthorized data.

  # ACM Threats
  - id: acm-certificate-expiration
    name: ACM Certificate Approaching Expiration
    description: |
      TLS certificates managed by ACM that are not set for automatic renewal
      may expire, causing service outages for HTTPS endpoints or forcing
      fallback to insecure connections.

  - id: acm-wildcard-overuse
    name: ACM Wildcard Certificate Shared Across Trust Boundaries
    description: |
      A single wildcard certificate used across multiple services or
      environments means compromise of one service's private key exposes
      all services under that domain to impersonation.

  - id: acm-no-certificate-transparency
    name: ACM Certificate Issued Without Transparency Logging
    description: |
      Certificates issued without certificate transparency logging cannot
      be monitored for unauthorized issuance, allowing an attacker with
      domain validation access to obtain rogue certificates undetected.

  # EBS Threats
  - id: ebs-public-snapshot
    name: EBS Snapshot Shared Publicly
    description: |
      EBS snapshots marked as public are accessible to any AWS account,
      enabling extraction of sensitive data including database contents,
      application secrets, and configuration files from the volume image.

  - id: ebs-unencrypted-volume
    name: EBS Volume Without Encryption
    description: |
      Unencrypted EBS volumes expose data at rest, including data persisted
      between instance stops/starts. Physical access to the underlying
      storage or snapshot access bypasses all application-layer controls.

  - id: ebs-snapshot-cross-account
    name: EBS Snapshot Shared Cross-Account Without Restrictions
    description: |
      EBS snapshots shared with specific AWS accounts without additional
      access controls create a data exfiltration path, as the recipient
      account can create volumes and access all data from the snapshot.

  - id: ebs-no-default-encryption
    name: EBS Default Encryption Not Enabled
    description: |
      Without account-level default encryption, newly created EBS volumes
      and snapshots are unencrypted unless explicitly specified, creating
      a systematic gap where any new volume is exposed by default.

  - id: ebs-direct-api-access
    name: EBS Direct API Enables Snapshot Data Extraction
    description: |
      The EBS Direct APIs (GetSnapshotBlock, ListSnapshotBlocks) allow
      reading snapshot data block-by-block without attaching to an EC2
      instance, enabling programmatic exfiltration of volume contents.

  # CloudFormation Threats
  - id: cloudformation-malicious-template
    name: Malicious CloudFormation Template Injection
    description: |
      An attacker who gains access to template sources can inject malicious resources
      or IAM policies into CloudFormation templates, deploying backdoors or privilege
      escalation paths across the infrastructure as code pipeline.

  - id: cloudformation-overprivileged-stack-role
    name: Overprivileged CloudFormation Stack Role
    description: |
      CloudFormation stack execution roles with excessive permissions allow template
      authors to create or modify any AWS resource, turning template deployment into
      a privilege escalation vector.

  - id: cloudformation-stack-drift
    name: CloudFormation Stack Drift
    description: |
      Manual changes to stack-managed resources cause drift between the declared
      template state and actual infrastructure, creating untracked security gaps
      that bypass change management and audit controls.

  - id: cloudformation-exported-secrets
    name: Secrets Leaked via CloudFormation Outputs
    description: |
      Sensitive values such as database credentials or API keys exposed through
      CloudFormation stack outputs or parameters are visible to any principal with
      DescribeStacks permission and logged in CloudTrail.

  # CodePipeline/CodeBuild Threats
  - id: codepipeline-pipeline-poisoning
    name: CI/CD Pipeline Poisoning
    description: |
      An attacker who compromises source repositories or build specifications can
      inject malicious build steps, altering deployed artifacts to include backdoors
      or exfiltrate secrets from the build environment.

  - id: codepipeline-build-secret-leakage
    name: Build Environment Secret Leakage
    description: |
      CodeBuild environments with access to environment variables, Parameter Store,
      or Secrets Manager can leak credentials through build logs, artifact outputs,
      or exfiltration during build execution.

  - id: codepipeline-artifact-tampering
    name: Pipeline Artifact Tampering
    description: |
      Insufficient integrity verification of build artifacts allows tampering
      between pipeline stages, enabling supply chain attacks where modified
      artifacts are deployed to production.

  - id: codepipeline-overprivileged-build-role
    name: Overprivileged CodeBuild Service Role
    description: |
      CodeBuild service roles with broad permissions allow build processes to
      access resources beyond their scope, enabling lateral movement from a
      compromised build environment into production infrastructure.

  # Elastic Beanstalk Threats
  - id: beanstalk-public-exposure
    name: Elastic Beanstalk Public-by-Default Exposure
    description: |
      Elastic Beanstalk environments default to public-facing configurations with
      internet-accessible load balancers, exposing applications before security
      controls are properly configured.

  - id: beanstalk-outdated-platform
    name: Outdated Elastic Beanstalk Platform Version
    description: |
      Running on unsupported or outdated platform versions leaves applications
      exposed to known vulnerabilities in the underlying runtime, web server,
      or operating system managed by Beanstalk.

  - id: beanstalk-permissive-instance-profile
    name: Overpermissive Beanstalk Instance Profile
    description: |
      Elastic Beanstalk EC2 instances with overly broad IAM instance profiles
      allow application code to access AWS resources beyond what the application
      requires, expanding blast radius of a compromised application.

  # Systems Manager (SSM) Threats
  - id: ssm-unencrypted-parameters
    name: Unencrypted SSM Parameter Store Secrets
    description: |
      Sensitive configuration values stored as plaintext String parameters
      instead of SecureString are readable by any principal with GetParameter
      access, bypassing encryption and audit controls.

  - id: ssm-unrestricted-session-access
    name: Unrestricted Session Manager Access
    description: |
      Session Manager provides shell access to EC2 instances without SSH keys or
      bastion hosts. Overly permissive IAM policies for StartSession allow
      unauthorized interactive access to compute resources.

  - id: ssm-run-command-abuse
    name: SSM Run Command Abuse
    description: |
      Run Command allows executing arbitrary commands across multiple EC2 instances.
      An attacker with SendCommand permissions can achieve remote code execution
      at scale without direct network access to the instances.

  - id: ssm-overprivileged-agent
    name: Overprivileged SSM Agent Permissions
    description: |
      EC2 instance profiles with broad SSM permissions allow the SSM agent to
      access Parameter Store secrets, run automation documents, or modify other
      managed instances beyond the intended scope.

  # GuardDuty Threats
  - id: guardduty-disabled
    name: GuardDuty Not Enabled
    description: |
      Without GuardDuty enabled, the account lacks automated threat detection
      for malicious activity including unauthorized API calls, cryptocurrency
      mining, compromised instances, and data exfiltration patterns.

  - id: guardduty-findings-ignored
    name: GuardDuty Findings Not Actioned
    description: |
      GuardDuty findings without automated response or alert routing allow
      detected threats to persist without remediation, negating the value of
      the detection service.

  - id: guardduty-incomplete-protection
    name: Incomplete GuardDuty Protection Features
    description: |
      GuardDuty protection features for specific services (S3, RDS, Lambda, EKS,
      EC2 runtime monitoring, malware scanning) are not all enabled, leaving
      blind spots in threat detection coverage.

  # Config Threats
  - id: config-not-enabled
    name: AWS Config Not Enabled
    description: |
      Without AWS Config recording, there is no continuous audit trail of
      resource configuration changes, making it impossible to detect drift,
      investigate incidents, or prove compliance posture.

  - id: config-incomplete-rules
    name: Incomplete Config Rule Coverage
    description: |
      AWS Config with insufficient rule coverage fails to detect non-compliant
      resource configurations, leaving security misconfigurations unidentified
      until exploited.

  - id: config-no-remediation
    name: Config Non-Compliance Without Remediation
    description: |
      Non-compliant Config rule evaluations without automated or manual
      remediation workflows allow known misconfigurations to persist
      indefinitely in the environment.

  # ElastiCache Threats
  - id: elasticache-no-auth
    name: Unauthenticated Cache Access
    description: |
      ElastiCache cluster configured without AUTH token allows any client with
      network access to read and write cached data including session tokens
      and credentials.

  - id: elasticache-unencrypted-transit
    name: Unencrypted Cache Traffic
    description: |
      In-transit encryption disabled on ElastiCache replication group exposes
      cached data to network eavesdropping between application and cache nodes.

  - id: elasticache-unencrypted-at-rest
    name: Unencrypted Cache Storage
    description: |
      At-rest encryption disabled on ElastiCache allows recovery of cached
      sensitive data from underlying storage or snapshots.

  - id: elasticache-public-exposure
    name: Publicly Accessible Cache Endpoint
    description: |
      ElastiCache cluster deployed in public subnet or with overly permissive
      security groups exposes cache data to unauthorized network access.

  - id: elasticache-snapshot-leak
    name: Cache Snapshot Data Exposure
    description: |
      ElastiCache snapshots shared externally or lacking encryption expose
      point-in-time copies of cached data including session state and credentials.

  # Redshift Threats
  - id: redshift-public-cluster
    name: Publicly Accessible Redshift Cluster
    description: |
      Redshift cluster with public accessibility enabled exposes data warehouse
      containing sensitive analytics data to internet-based attacks.

  - id: redshift-unencrypted-storage
    name: Unencrypted Redshift Data Warehouse
    description: |
      Redshift cluster without at-rest encryption allows unauthorized access to
      analytical data through storage-level compromise.

  - id: redshift-missing-audit-logging
    name: Missing Redshift Audit Logging
    description: |
      Redshift audit logging not enabled prevents detection of unauthorized
      queries, data exfiltration, or privilege abuse against the data warehouse.

  - id: redshift-spectrum-s3-exposure
    name: Overpermissive Redshift Spectrum Access
    description: |
      Redshift Spectrum role with broad S3 permissions allows warehouse queries
      to access data beyond intended scope across S3 buckets.

  - id: redshift-snapshot-exposure
    name: Shared Redshift Snapshot Data Leak
    description: |
      Redshift snapshots shared with other accounts or made public expose full
      copies of data warehouse contents.

  # Security Hub Threats
  - id: security-hub-disabled
    name: Security Hub Not Enabled
    description: |
      Security Hub disabled in one or more accounts creates blind spots where
      security findings from GuardDuty, Inspector, Config, and other services
      are not aggregated or acted upon.

  - id: security-hub-no-auto-enable
    name: New Accounts Missing Security Hub
    description: |
      Auto-enable for new organization accounts not configured allows newly
      provisioned accounts to operate without centralized security monitoring.

  - id: security-hub-unactioned-findings
    name: Security Findings Not Acted Upon
    description: |
      Accumulated Security Hub findings without automated remediation workflows
      or alert routing allow known vulnerabilities and misconfigurations to
      persist indefinitely.

  # SageMaker Threats
  - id: sagemaker-public-notebook
    name: Internet-Accessible SageMaker Notebook
    description: |
      SageMaker notebook instance with direct internet access allows exfiltration
      of training data and model artifacts, and exposes the notebook to remote
      exploitation.

  - id: sagemaker-no-vpc-isolation
    name: SageMaker Resources Outside VPC
    description: |
      SageMaker training jobs and endpoints not deployed within a VPC allow
      training data and model inference traffic to traverse public networks.

  - id: sagemaker-root-access
    name: Root Access on Notebook Instances
    description: |
      SageMaker notebook instances with root access enabled allow privilege
      escalation and unrestricted modification of the training environment.

  - id: sagemaker-training-data-poisoning
    name: Training Data Poisoning via S3
    description: |
      Insufficiently protected S3 training data sources allow adversaries to
      inject poisoned data that degrades or backdoors trained models.

  - id: sagemaker-model-endpoint-abuse
    name: Unrestricted Model Endpoint Access
    description: |
      SageMaker inference endpoints without IAM authorization or throttling
      allow unauthorized model queries, enabling model extraction or cost
      harvesting.

  # Bedrock Agents Threats
  - id: bedrock-agent-tool-invocation
    name: Prompt Injection Triggers Agent Tool Invocation
    description: |
      Adversary injects prompts that cause a Bedrock Agent to invoke action
      group Lambda functions, executing real-world side effects like data
      modification or API calls.

  - id: bedrock-agent-overpermissive-actions
    name: Overpermissive Agent Action Groups
    description: |
      Bedrock Agent action groups configured with broad IAM permissions allow
      the agent to access resources or perform operations beyond its intended
      scope.

  - id: bedrock-agent-role-escalation
    name: Agent Service Role Escalation
    description: |
      Bedrock Agent service role with excessive privileges allows an attacker
      who compromises agent behavior to escalate to broader AWS resource access.

  - id: bedrock-agent-no-guardrails
    name: Agent Operating Without Guardrails
    description: |
      Bedrock Agent deployed without Guardrails association processes unconstrained
      inputs and outputs, enabling jailbreak, data extraction, and harmful content
      generation.

  # Bedrock Knowledge Bases Threats
  - id: bedrock-kb-data-poisoning
    name: Knowledge Base Data Source Poisoning
    description: |
      Adversary injects malicious content into S3 buckets or other data sources
      indexed by a Knowledge Base, contaminating retrieval results with prompt
      injections or disinformation.

  - id: bedrock-kb-overpermissive-sync
    name: Overly Broad Knowledge Base Data Source Scope
    description: |
      Knowledge Base configured to sync entire S3 buckets or broad data source
      paths ingests sensitive documents not intended for retrieval, exposing them
      through user queries.

  - id: bedrock-kb-cross-context-leakage
    name: Cross-Context Retrieval Leakage
    description: |
      Knowledge Base retrieval returns chunks from documents belonging to different
      tenants or security contexts, leaking information across authorization
      boundaries.

  - id: bedrock-kb-credential-harvesting
    name: Credential Harvesting via Knowledge Base Retrieval
    description: |
      Internal documents containing credentials or secrets are ingested into the
      Knowledge Base and subsequently retrieved and exposed through user queries.
