pack:
  schema_version: 1
  slug: aws
  name: AWS
  version: 4.0.0
  pack_type: full
  description: |
    Comprehensive AWS threat library covering core infrastructure, compute, networking,
    identity, encryption, databases, audit, containers, secrets management, CDN, DNS,
    AI/ML, events, DevOps, and detection services. Includes IAM, VPC, EC2, ELB,
    RDS/Aurora, CloudTrail, KMS, ECS, EKS, ECR, Secrets Manager, CloudFront, Route 53,
    S3, Lambda, API Gateway, DynamoDB, SQS, Bedrock, OpenSearch Serverless, Cognito,
    WAF, CloudWatch, SNS, EventBridge, Step Functions, AppSync, ACM, EBS,
    CloudFormation, CodePipeline/CodeBuild, Elastic Beanstalk, SSM, GuardDuty,
    AWS Config, ElastiCache, Redshift, Security Hub, SageMaker, Bedrock Agents,
    and Bedrock Knowledge Bases.
    Threats sourced from AWS Security Hub controls and AWS security best practices.
    Mapped to STRIDE, CWE, CAPEC, MITRE ATT&CK, and MITRE ATLAS taxonomies with
    compliance overlays for OWASP ASVS, OWASP AISVS, CRA, NIST CSF, OWASP Top 10,
    and SOC 2.
  author: Precogly
  depends_on:
  - taxonomies/stride-taxonomy
  - taxonomies/capec
  - taxonomies/cwe
  - taxonomies/mitre-attack
  - taxonomies/mitre-atlas
  - threat-libraries/ai
