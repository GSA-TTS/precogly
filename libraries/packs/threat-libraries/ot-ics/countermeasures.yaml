countermeasures:
  # ============================================================================
  # Network Security
  # ============================================================================
  - id: network-segmentation
    name: Purdue Model Network Segmentation
    description: |
      Implement network segmentation following the Purdue Enterprise Reference
      Architecture (ISA-95/IEC 62443 zones and conduits). Separate Level 0-1
      (field devices, controllers) from Level 2 (supervisory), Level 3 (operations),
      and Level 4-5 (enterprise) with firewalls at each boundary.
    control_functions: [preventive]
    cost: high

  - id: industrial-dmz
    name: Industrial DMZ
    description: |
      Deploy an industrial DMZ (Level 3.5) between IT and OT networks to
      broker all cross-boundary data transfers. Use data diodes, jump servers,
      and application-level gateways to prevent direct connectivity between
      enterprise and control system networks.
    control_functions: [preventive]
    cost: high

  - id: deep-packet-inspection
    name: Industrial Protocol Deep Packet Inspection
    description: |
      Deploy OT-aware firewalls capable of deep packet inspection for industrial
      protocols (Modbus, DNP3, EtherNet/IP, OPC UA). Enforce protocol allowlisting,
      validate function codes, and block unauthorized read/write operations
      at the application layer.
    control_functions: [preventive]
    cost: high

  - id: network-monitoring
    name: OT Network Traffic Monitoring
    description: |
      Deploy passive network monitoring with OT protocol awareness to detect
      anomalous traffic patterns, unauthorized devices, and suspicious commands.
      Solutions such as Claroty, Nozomi Networks, or Dragos provide asset
      discovery and threat detection without impacting control traffic.
    control_functions: [detective]
    cost: high

  # ============================================================================
  # Access Control
  # ============================================================================
  - id: ot-rbac
    name: OT Role-Based Access Control
    description: |
      Implement role-based access control across all OT systems including SCADA,
      HMI, engineering workstations, and historian. Define roles for operators,
      engineers, maintenance, and administrators with least-privilege permissions
      appropriate to each function.
    control_functions: [preventive]
    cost: medium

  - id: mfa-remote-access
    name: Multi-Factor Authentication for Remote OT Access
    description: |
      Require multi-factor authentication for all remote access to OT networks
      and systems. Apply to VPN connections, jump server access, and vendor
      remote support sessions. Combine with session recording and time-limited
      access windows.
    control_functions: [preventive]
    cost: medium

  - id: physical-access-control
    name: Physical Access Controls for Control Equipment
    description: |
      Implement physical security controls for control rooms, field cabinets,
      server rooms, and wiring closets. Include key-card access, surveillance
      cameras, visitor logging, and tamper-evident enclosures for critical
      equipment.
    control_functions: [preventive]
    cost: medium

  - id: secure-remote-access
    name: Secure Remote Access Solution
    description: |
      Deploy a purpose-built OT remote access solution with session recording,
      approval workflows, and time-limited access. Route all remote sessions
      through a jump server in the industrial DMZ with full audit logging.
      Never allow direct RDP or VPN into the control network.
    control_functions: [preventive]
    cost: high

  # ============================================================================
  # Device Hardening
  # ============================================================================
  - id: plc-access-protection
    name: PLC Access Protection
    description: |
      Enable PLC access protection features including physical key switch
      settings, programming passwords, access control lists, and CPU protection
      levels. Restrict programming access to authorized engineering workstations
      and require authentication for online changes.
    control_functions: [preventive]
    cost: low

  - id: firmware-validation
    name: Firmware Integrity Validation
    description: |
      Implement firmware integrity validation for controllers, RTUs, and
      embedded devices. Verify firmware checksums against vendor-published
      values before and after updates. Maintain a firmware baseline inventory
      and alert on unauthorized changes.
    control_functions: [detective]
    cost: medium

  - id: change-management
    name: Industrial Change Management Process
    description: |
      Implement a formal change management process (Management of Change / MOC)
      for all control system modifications including logic changes, configuration
      updates, firmware upgrades, and network changes. Require peer review,
      testing, and approval before deployment.
    control_functions: [preventive]
    control_nature: administrative
    cost: low

  - id: configuration-backup
    name: Control System Configuration Backup
    description: |
      Maintain regular, verified backups of all control system configurations
      including PLC programs, DCS projects, HMI screens, historian settings,
      and network device configurations. Store backups offline with versioning
      and test restoration procedures periodically.
    control_functions: [corrective]
    cost: low

  # ============================================================================
  # Protocol Security
  # ============================================================================
  - id: encrypted-protocols
    name: Encrypted Industrial Protocols
    description: |
      Deploy encrypted industrial protocols where supported: OPC UA with
      Security Mode SignAndEncrypt, DNP3 Secure Authentication, TLS-wrapped
      Modbus, or encrypted fieldbus variants. Prioritize critical communication
      paths and data containing process recipes or safety parameters.
    control_functions: [preventive]
    cost: medium

  - id: protocol-allowlisting
    name: Industrial Protocol Allowlisting
    description: |
      Configure firewalls and network devices to allow only authorized
      industrial protocols and function codes on each network segment.
      Block unnecessary protocols and restrict Modbus/DNP3 function codes
      to only those required for normal operation.
    control_functions: [preventive]
    cost: medium

  - id: command-authentication
    name: Control Command Authentication
    description: |
      Implement authentication for control commands using DNP3 Secure
      Authentication, OPC UA certificates, or application-level signing.
      Ensures that commands originate from authorized sources and have
      not been modified in transit.
    control_functions: [preventive]
    cost: medium

  # ============================================================================
  # Monitoring and Detection
  # ============================================================================
  - id: ot-siem
    name: OT Security Information and Event Management
    description: |
      Integrate OT system logs, network monitoring alerts, and process anomaly
      events into a security information and event management (SIEM) platform.
      Correlate IT and OT security events to detect multi-stage attacks that
      traverse network boundaries.
    control_functions: [detective]
    cost: high

  - id: ids-ips-ot
    name: Industrial IDS/IPS
    description: |
      Deploy OT-specific intrusion detection and prevention systems that
      understand industrial protocols and can detect known ICS attack patterns,
      unauthorized programming commands, and anomalous network behavior without
      disrupting control traffic.
    control_functions: [detective]
    cost: high

  - id: process-anomaly-detection
    name: Process Value Anomaly Detection
    description: |
      Monitor process values (temperatures, pressures, flows, levels) for
      anomalies that may indicate cyber-physical attacks. Compare real-time
      values against process models and historical baselines to detect
      manipulated sensor readings or unauthorized setpoint changes.
    control_functions: [detective]
    cost: medium

  - id: audit-logging
    name: Comprehensive OT Audit Logging
    description: |
      Enable audit logging on all OT systems including SCADA, HMI, historians,
      engineering workstations, and network devices. Log authentication events,
      configuration changes, control commands, and alarm acknowledgments with
      tamper-resistant storage.
    control_functions: [detective]
    cost: low

  # ============================================================================
  # Safety
  # ============================================================================
  - id: sis-independence
    name: SIS Independence and Isolation
    description: |
      Maintain complete independence and logical separation of the Safety
      Instrumented System (SIS) from the Basic Process Control System (BPCS)
      per IEC 61511. Use separate controllers, networks, sensors, and final
      elements. Never allow engineering access to SIS from the BPCS network.
    control_functions: [preventive]
    cost: high

  - id: safety-integrity-verification
    name: Safety Integrity Level Verification
    description: |
      Conduct regular verification of Safety Integrity Level (SIL) ratings
      through proof testing, diagnostic coverage analysis, and common cause
      failure assessment per IEC 61511. Verify that cybersecurity controls
      do not degrade the achieved SIL.
    control_functions: [detective]
    cost: medium

  - id: emergency-procedures
    name: Emergency Response Procedures
    description: |
      Develop and regularly test emergency response procedures for cyber
      incidents affecting industrial processes. Include manual override
      procedures, safe shutdown sequences, and communication protocols.
      Train operators on manual process control in case of control system loss.
    control_functions: [corrective]
    cost: low

  # ============================================================================
  # Supply Chain and Lifecycle
  # ============================================================================
  - id: vendor-assessment
    name: Control System Vendor Security Assessment
    description: |
      Conduct security assessments of control system vendors covering
      their development practices, patch management, incident response,
      and supply chain controls. Include cybersecurity requirements in
      procurement specifications per IEC 62443-2-4.
    control_functions: [preventive]
    cost: medium

  - id: patch-management
    name: OT Patch Management Program
    description: |
      Implement a structured OT patch management program with risk-based
      prioritization, vendor compatibility testing, and scheduled maintenance
      windows. Address the reality that many OT systems cannot be patched
      promptly by implementing compensating controls for unpatched systems.
    control_functions: [corrective]
    cost: medium

  - id: asset-inventory
    name: OT Asset Inventory
    description: |
      Maintain a comprehensive, up-to-date inventory of all OT assets including
      controllers, network devices, software versions, firmware revisions,
      and communication paths. Use automated discovery tools to identify
      unknown or unauthorized devices on the control network.
    control_functions: [detective]
    cost: medium
