components:
  # Inference
  - id: llm
    name: Large Language Model
    category: process
    type: Language Model
    icon: icons/llm.svg
    description: |
      A large language model that generates text, answers questions, or follows instructions
      based on input prompts. Serves as the core inference engine in AI applications, processing
      user and system prompts and producing natural language outputs.

  # RAG components
  - id: vector-database
    name: Vector Database
    category: datastore
    type: Vector Store
    icon: icons/vector-database.svg
    description: |
      A specialized database that stores and retrieves high-dimensional vector embeddings
      for similarity search. Used in RAG architectures to find relevant context documents
      based on semantic similarity to a query.

  - id: embedding-service
    name: Embedding Service
    category: process
    type: Embedding Generator
    icon: icons/embedding-service.svg
    description: |
      A service that converts text, images, or other content into dense vector representations
      (embeddings). Feeds vector databases in RAG pipelines and powers semantic search,
      clustering, and similarity-based retrieval.

  - id: document-store
    name: Document Store
    category: datastore
    type: Document Storage
    icon: icons/document-store.svg
    description: |
      A repository of source documents, knowledge articles, or reference data used as the
      ground truth for RAG pipelines. Documents are chunked, embedded, and indexed into
      vector databases for retrieval during inference.

  # Agentic components
  - id: agent-orchestrator
    name: Agent Orchestrator
    category: process
    type: Orchestration Engine
    icon: icons/agent-orchestrator.svg
    description: |
      A control layer that coordinates autonomous AI agents, managing task decomposition,
      planning, memory, and multi-step reasoning loops. Routes agent actions to tools,
      sub-agents, or human approvals based on policies and goals.

  - id: tool-executor
    name: Tool Executor
    category: process
    type: Tool Runtime
    icon: icons/tool-executor.svg
    description: |
      A runtime environment that executes tool calls initiated by AI agents. Handles
      function invocation, parameter validation, and result marshalling for tools such
      as APIs, databases, file systems, and code interpreters.

  - id: mcp-server
    name: MCP Server
    category: process
    type: Tool Server
    icon: icons/mcp-server.svg
    description: |
      A Model Context Protocol server that exposes tools, resources, and prompts to
      AI agents over a standardized interface. Bridges the gap between LLM-based agents
      and external systems, services, or data sources.

  # Safety and gateway
  - id: guardrail
    name: AI Guardrail
    category: process
    type: Security Filter
    icon: icons/guardrail.svg
    description: |
      A filtering layer that inspects and validates LLM inputs and outputs against safety
      policies. Detects prompt injection attempts, blocks harmful or policy-violating content,
      and enforces content moderation rules before responses reach users.

  - id: ai-gateway
    name: AI Gateway
    category: process
    type: API Gateway
    icon: icons/ai-gateway.svg
    description: |
      A gateway that mediates access to AI model endpoints, enforcing rate limits,
      authentication, usage quotas, and routing policies. Provides centralized monitoring,
      cost tracking, and audit logging for all model interactions.

  # Training and evaluation
  - id: training-pipeline
    name: Training Pipeline
    category: process
    type: ML Pipeline
    icon: icons/training-pipeline.svg
    description: |
      An automated pipeline that trains, fine-tunes, or adapts AI models using curated
      datasets. Manages data preprocessing, training runs, hyperparameter tuning, and
      model artifact production.

  - id: model-registry
    name: Model Registry
    category: datastore
    type: Model Repository
    icon: icons/model-registry.svg
    description: |
      A versioned repository that stores trained model artifacts, weights, configurations,
      and metadata. Tracks model lineage, approval status, and deployment history across
      the model lifecycle.

  - id: evaluation-harness
    name: Evaluation Harness
    category: process
    type: Test Framework
    icon: icons/evaluation-harness.svg
    description: |
      A framework for systematically testing and benchmarking AI model behavior against
      correctness, safety, robustness, and fairness criteria. Runs automated evaluation
      suites and red-team assessments before models are promoted to production.
