countermeasures:
  # ============================================================================
  # LLM Countermeasures
  # ============================================================================
  - id: llm-input-guardrail
    name: LLM Input Guardrail
    description: |
      Deploy input-side guardrails that detect and block prompt injection attempts,
      jailbreak patterns, and policy-violating prompts before they reach the LLM.
    control_functions: [preventive]
    cost: medium

  - id: llm-output-validation
    name: LLM Output Validation and Sanitization
    description: |
      Validate and sanitize all LLM outputs before passing them to downstream
      systems. Apply context-appropriate encoding to prevent injection attacks
      in consuming applications.
    control_functions: [preventive]
    cost: low

  - id: llm-output-guardrail
    name: LLM Output Guardrail
    description: |
      Deploy output-side guardrails that detect and filter harmful, biased,
      or policy-violating content in LLM responses before they reach end users.
    control_functions: [detective, preventive]
    cost: medium

  - id: llm-system-prompt-protection
    name: System Prompt Isolation and Protection
    description: |
      Isolate system prompts from user-accessible context. Apply prompt
      hardening techniques and test for prompt extraction resistance to
      prevent leakage of internal instructions.
    control_functions: [preventive]
    cost: low

  - id: llm-rag-grounding
    name: RAG-Based Grounding for Factual Accuracy
    description: |
      Ground LLM responses in retrieved source documents using RAG to reduce
      hallucination. Include source citations in outputs so users can verify
      claims against authoritative references.
    control_functions: [preventive]
    cost: medium

  - id: llm-rate-limiting
    name: LLM Request Rate Limiting
    description: |
      Enforce per-user and per-session rate limits on LLM requests, including
      token consumption caps and concurrent request limits, to prevent resource
      exhaustion and cost abuse.
    control_functions: [preventive]
    cost: low

  - id: llm-least-privilege
    name: LLM Least-Privilege Tool Access
    description: |
      Restrict the LLM's access to tools, APIs, and data sources to the minimum
      required for its intended function. Enforce explicit allowlists for
      permitted tool calls and data scopes.
    control_functions: [preventive]
    cost: low

  - id: llm-differential-privacy
    name: Training Data Privacy Controls
    description: |
      Apply differential privacy techniques, data deduplication, and PII
      scrubbing during training to minimize memorization of sensitive
      information in model weights.
    control_functions: [preventive]
    cost: high

  # ============================================================================
  # Vector Database Countermeasures
  # ============================================================================
  - id: vecdb-access-control
    name: Vector Database Access Control
    description: |
      Enforce role-based access controls on the vector database, restricting
      query and write access to authorized services and users. Implement
      document-level or namespace-level permissions.
    control_functions: [preventive]
    cost: low

  - id: vecdb-input-validation
    name: Document Ingestion Validation
    description: |
      Validate and sanitize all documents before ingestion into the knowledge
      base. Screen for adversarial content, embedded instructions, and data
      quality issues.
    control_functions: [preventive]
    cost: medium

  - id: vecdb-tenant-isolation
    name: Vector Store Tenant Isolation
    description: |
      Isolate vector embeddings by tenant using separate namespaces, indices,
      or dedicated instances. Enforce tenant-scoped queries to prevent
      cross-tenant data leakage.
    control_functions: [preventive]
    cost: medium

  - id: vecdb-metadata-filtering
    name: Retrieval Metadata Filtering
    description: |
      Apply metadata-based access filters at query time to enforce document-level
      permissions, ensuring retrieval results respect the requesting user's
      authorization scope.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # Embedding Service Countermeasures
  # ============================================================================
  - id: embed-integrity-verification
    name: Embedding Model Integrity Verification
    description: |
      Verify embedding model checksums and signatures before deployment.
      Monitor embedding distributions for drift that could indicate model
      substitution or tampering.
    control_functions: [detective, preventive]
    cost: low

  - id: embed-transport-encryption
    name: Embedding API Transport Encryption
    description: |
      Encrypt all data in transit to and from embedding services using TLS.
      For external embedding providers, evaluate data processing agreements
      and consider self-hosted alternatives for sensitive data.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # Agent Orchestrator Countermeasures
  # ============================================================================
  - id: agent-goal-validation
    name: Agent Goal Constraint Enforcement
    description: |
      Define explicit goal constraints and task boundaries for agents. Validate
      that agent actions align with the original user-specified objective at
      each step of the planning loop.
    control_functions: [preventive]
    cost: medium

  - id: agent-least-privilege
    name: Agent Least-Privilege Credentials
    description: |
      Issue agents short-lived, narrowly scoped credentials that grant only the
      permissions required for the current task. Rotate credentials between
      sessions and revoke on task completion.
    control_functions: [preventive]
    cost: medium

  - id: agent-hitl
    name: Human-in-the-Loop Approval Gates
    description: |
      Require explicit human approval for high-impact agent actions such as data
      modification, external communications, financial transactions, or
      irreversible operations.
    control_functions: [preventive]
    cost: low

  - id: agent-memory-isolation
    name: Agent Memory Isolation and Validation
    description: |
      Isolate agent memory stores per session or user. Validate memory contents
      on retrieval to detect injected or tampered entries before they influence
      agent decisions.
    control_functions: [preventive, detective]
    cost: medium

  - id: agent-inter-agent-auth
    name: Inter-Agent Authentication and Integrity
    description: |
      Authenticate agent-to-agent communications using signed messages or mutual
      TLS. Verify the integrity and source of delegated tasks before execution.
    control_functions: [preventive]
    cost: medium

  - id: agent-behavior-monitoring
    name: Agent Behavior Monitoring and Anomaly Detection
    description: |
      Monitor agent actions, tool calls, and decision patterns in real time.
      Alert on anomalous behavior such as unexpected tool usage, scope
      escalation, or deviation from expected task patterns.
    control_functions: [detective]
    cost: medium

  - id: agent-circuit-breaker
    name: Agent Circuit Breaker
    description: |
      Implement circuit breakers that halt agent execution when error rates,
      cost thresholds, or action counts exceed predefined limits, preventing
      cascading failures and runaway execution.
    control_functions: [corrective]
    cost: low

  # ============================================================================
  # Tool Executor Countermeasures
  # ============================================================================
  - id: tool-parameter-validation
    name: Tool Parameter Validation
    description: |
      Validate all tool call parameters against strict schemas before execution.
      Reject calls with unexpected types, out-of-range values, or parameters
      that do not match the tool's defined interface.
    control_functions: [preventive]
    cost: low

  - id: tool-sandboxing
    name: Tool Execution Sandboxing
    description: |
      Execute tool calls in isolated sandboxes with restricted filesystem,
      network, and system access. Use containers, seccomp profiles, or
      virtual environments to contain the blast radius of compromised tools.
    control_functions: [preventive]
    cost: medium

  - id: tool-least-privilege
    name: Tool Execution Least Privilege
    description: |
      Run each tool with the minimum permissions required for its function.
      Use separate service accounts per tool category and avoid shared
      credentials across tool boundaries.
    control_functions: [preventive]
    cost: low

  - id: tool-allowlist
    name: Tool Invocation Allowlisting
    description: |
      Maintain an explicit allowlist of permitted tools and their callable
      operations. Block dynamic tool registration and reject calls to
      tools not on the approved list.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # MCP Server Countermeasures
  # ============================================================================
  - id: mcp-tool-schema-validation
    name: MCP Tool Schema Validation
    description: |
      Validate MCP tool definitions against trusted schemas. Review tool
      descriptions for hidden instructions or prompt injection payloads
      before exposing them to agents.
    control_functions: [preventive]
    cost: low

  - id: mcp-secret-management
    name: MCP Secret Management
    description: |
      Store MCP server credentials in dedicated secret managers. Never pass
      secrets through model context or environment variables accessible to
      the LLM. Rotate credentials regularly.
    control_functions: [preventive]
    cost: low

  - id: mcp-scope-enforcement
    name: MCP Permission Scope Enforcement
    description: |
      Define and enforce granular permission scopes for each MCP server
      connection. Validate tool capabilities against declared scopes and
      deny operations that exceed the authorized scope.
    control_functions: [preventive]
    cost: medium

  - id: mcp-dependency-verification
    name: MCP Dependency Verification
    description: |
      Verify MCP server packages and dependencies using integrity checks,
      signed releases, and vulnerability scanning before deployment.
      Pin dependency versions and monitor for supply chain advisories.
    control_functions: [preventive]
    cost: low

  - id: mcp-server-inventory
    name: MCP Server Inventory and Governance
    description: |
      Maintain a centralized inventory of all approved MCP servers. Implement
      deployment controls that prevent unauthorized MCP server registration
      and flag shadow deployments.
    control_functions: [detective, preventive]
    cost: low

  - id: mcp-auth-enforcement
    name: MCP Authentication and Authorization
    description: |
      Enforce authentication for all MCP client connections. Implement per-tool
      authorization policies that validate the calling agent's identity and
      permissions before executing tool operations.
    control_functions: [preventive]
    cost: medium

  - id: mcp-audit-logging
    name: MCP Audit Logging
    description: |
      Log all MCP tool invocations including caller identity, tool name,
      parameters, and results. Enable tamper-resistant audit trails for
      forensic analysis and compliance.
    control_functions: [detective]
    cost: low

  - id: mcp-context-isolation
    name: MCP Context Isolation
    description: |
      Isolate context windows between MCP tool sessions to prevent information
      leakage across tasks, users, or security domains. Clear sensitive context
      after each tool interaction.
    control_functions: [preventive]
    cost: medium

  # ============================================================================
  # Guardrail Countermeasures
  # ============================================================================
  - id: guardrail-adversarial-testing
    name: Guardrail Adversarial Testing
    description: |
      Regularly test guardrails against known and emerging bypass techniques
      including encoding tricks, multi-language attacks, and context manipulation.
      Update detection rules based on test results.
    control_functions: [detective]
    cost: medium

  - id: guardrail-layered-defense
    name: Layered Guardrail Architecture
    description: |
      Deploy multiple independent guardrail layers (keyword filters, classifier
      models, semantic analysis) so that bypass of one layer is caught by
      another. Apply guardrails on both input and output paths.
    control_functions: [preventive]
    cost: high

  - id: guardrail-policy-review
    name: Guardrail Policy Review and Updates
    description: |
      Establish a regular review cadence for guardrail rules and policies.
      Update detection patterns based on new attack techniques, false positive
      analysis, and evolving content policies.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # Training Pipeline Countermeasures
  # ============================================================================
  - id: training-data-validation
    name: Training Data Validation and Curation
    description: |
      Validate training data sources for integrity, quality, and provenance.
      Screen datasets for adversarial samples, poisoned labels, and embedded
      trigger patterns before use in training.
    control_functions: [preventive]
    cost: medium

  - id: training-data-provenance
    name: Training Data Provenance Tracking
    description: |
      Track the origin, transformations, and chain of custody for all training
      data. Maintain auditable records of data sources, preprocessing steps,
      and inclusion criteria.
    control_functions: [detective]
    cost: medium

  - id: training-access-control
    name: Training Pipeline Access Control
    description: |
      Restrict access to training infrastructure, data stores, and pipeline
      configuration to authorized ML engineers. Enforce separation of duties
      between data preparation, training, and deployment roles.
    control_functions: [preventive]
    cost: low

  - id: training-pii-scrubbing
    name: Training Data PII Scrubbing
    description: |
      Scan and remove PII, credentials, and sensitive information from training
      data before model training. Apply automated redaction and manual review
      for high-sensitivity datasets.
    control_functions: [preventive]
    cost: medium

  # ============================================================================
  # Model Registry Countermeasures
  # ============================================================================
  - id: registry-integrity-verification
    name: Model Artifact Integrity Verification
    description: |
      Sign model artifacts cryptographically and verify signatures before
      deployment. Use content-addressable storage and checksums to detect
      unauthorized modifications to model weights or configurations.
    control_functions: [preventive, detective]
    cost: low

  - id: registry-access-control
    name: Model Registry Access Control
    description: |
      Enforce role-based access controls on model registry operations.
      Require approval workflows for model promotion to production and
      restrict write access to authorized pipeline service accounts.
    control_functions: [preventive]
    cost: low

  - id: registry-lineage-tracking
    name: Model Lineage and Provenance Tracking
    description: |
      Record complete model lineage including training data versions, code
      commits, hyperparameters, and evaluation results. Use immutable
      metadata to detect provenance manipulation.
    control_functions: [detective]
    cost: medium

  # ============================================================================
  # Document Store Countermeasures
  # ============================================================================
  - id: docstore-content-screening
    name: Document Ingestion Content Screening
    description: |
      Screen documents for adversarial content, prompt injection payloads,
      and sensitive data before ingestion into the knowledge base. Apply
      content classification and policy-based filtering.
    control_functions: [preventive]
    cost: medium

  - id: docstore-access-control
    name: Document Store Access Control
    description: |
      Enforce document-level access controls that propagate through the RAG
      pipeline. Ensure retrieval results respect the requesting user's
      authorization scope and classification level.
    control_functions: [preventive]
    cost: medium

  - id: docstore-sensitive-data-redaction
    name: Source Document Sensitive Data Redaction
    description: |
      Identify and redact PII, credentials, and confidential information in
      source documents before embedding and indexing. Apply automated
      detection with manual review for high-sensitivity content.
    control_functions: [preventive]
    cost: medium

  # ============================================================================
  # AI Gateway Countermeasures
  # ============================================================================
  - id: gateway-rate-limiting
    name: AI Gateway Rate Limiting and Quotas
    description: |
      Enforce multi-dimensional rate limits (requests per second, tokens per
      minute, cost per day) at the gateway level. Apply per-user, per-application,
      and per-model quotas to prevent abuse.
    control_functions: [preventive]
    cost: low

  - id: gateway-auth
    name: AI Gateway Authentication and Authorization
    description: |
      Require authenticated access to all model endpoints via the gateway.
      Enforce per-model authorization policies and validate API keys, tokens,
      or certificates on every request.
    control_functions: [preventive]
    cost: low

  - id: gateway-comprehensive-logging
    name: AI Gateway Comprehensive Logging
    description: |
      Log all model interactions at the gateway including request metadata,
      prompt content (with appropriate redaction), response summaries, token
      usage, and latency metrics. Retain logs for incident investigation.
    control_functions: [detective]
    cost: medium

  - id: gateway-model-routing-control
    name: AI Gateway Model Routing Control
    description: |
      Lock model routing configuration to prevent unauthorized changes.
      Validate model version references and enforce deployment approval
      gates before routing traffic to new model versions.
    control_functions: [preventive]
    cost: low

  # ============================================================================
  # Evaluation Harness Countermeasures
  # ============================================================================
  - id: eval-adversarial-testing
    name: Adversarial and Red-Team Evaluation
    description: |
      Include adversarial test cases, red-team scenarios, and safety benchmarks
      in model evaluation suites. Test for prompt injection resistance, bias,
      harmful output generation, and known attack patterns.
    control_functions: [detective]
    cost: medium

  - id: eval-data-separation
    name: Evaluation Data Separation
    description: |
      Maintain strict separation between training, validation, and test datasets.
      Use holdout strategies and monitor for data leakage between pipelines to
      ensure evaluation results reflect genuine model capability.
    control_functions: [preventive]
    cost: low

  - id: eval-pipeline-integrity
    name: Evaluation Pipeline Integrity Controls
    description: |
      Protect evaluation scripts, scoring functions, and benchmark datasets
      with version control, code review, and access restrictions. Log all
      evaluation runs with immutable records of inputs, configurations, and results.
    control_functions: [preventive, detective]
    cost: low
