taxonomy: stride

mappings:
  # LLM threats
  - threat: llm-prompt-injection
    entries: [tampering, elevation-of-privilege]
  - threat: llm-sensitive-info-disclosure
    entries: [information-disclosure]
  - threat: llm-system-prompt-leakage
    entries: [information-disclosure]
  - threat: llm-insecure-output-handling
    entries: [tampering, elevation-of-privilege]
  - threat: llm-misinformation
    entries: [tampering]
  - threat: llm-unbounded-consumption
