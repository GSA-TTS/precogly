threats:
  # ============================================================================
  # LLM Threats
  # ============================================================================
  - id: llm-prompt-injection
    name: Prompt Injection
    description: |
      Attacker crafts input that causes the LLM to ignore system instructions and
      execute unintended actions, bypassing application-layer access controls.
      Includes both direct injection via user input and indirect injection via
      poisoned context from retrieved documents or tool outputs.

  - id: llm-sensitive-info-disclosure
    name: Sensitive Information Disclosure via LLM Output
    description: |
      LLM reveals sensitive information from training data, system prompts, or
      retrieved context in its responses. Includes memorized PII, credentials,
      proprietary data, or internal system details.

  - id: llm-system-prompt-leakage
    name: System Prompt Leakage
    description: |
      Attacker extracts system prompt content through crafted queries, revealing
      application logic, access control rules, and internal instructions that
      inform further attacks.

  - id: llm-insecure-output-handling
    name: Insecure Output Handling
    description: |
      LLM-generated output is passed to downstream systems without validation or
      sanitization, enabling injection attacks such as XSS, SQL injection, or
      command injection in consuming applications.

  - id: llm-misinformation
    name: LLM Hallucination and Misinformation
    description: |
      LLM generates factually incorrect, fabricated, or misleading content that
      users or downstream systems treat as authoritative, leading to incorrect
      decisions, reputational damage, or safety incidents.

  - id: llm-unbounded-consumption
    name: Unbounded Resource Consumption
    description: |
      Attacker triggers excessive LLM token generation or repeated inference
      requests, causing denial of service, cost exhaustion, or degraded
      performance for legitimate users.

  - id: llm-excessive-agency
    name: Excessive LLM Agency
    description: |
      LLM is granted permissions or tool access beyond what is required, enabling
      it to perform high-impact actions (data modification, external API calls,
      system commands) without sufficient human oversight or scope restrictions.

  - id: llm-training-data-extraction
    name: Training Data Extraction
    description: |
      Adversary uses targeted prompting techniques to extract memorized training
      data from the model, recovering verbatim text, PII, or proprietary
      information that was present in the training corpus.

  # ============================================================================
  # Vector Database Threats
  # ============================================================================
  - id: vecdb-poisoned-embeddings
    name: Embedding Poisoning via Document Injection
    description: |
      Attacker injects crafted documents into the knowledge base that produce
      adversarial embeddings, causing the retrieval system to return malicious
      or misleading content in response to targeted queries.

  - id: vecdb-unauthorized-retrieval
    name: Unauthorized Access to Vector Store Contents
    description: |
      Insufficient access controls on the vector database allow unauthorized
      users or components to query and retrieve sensitive document embeddings
      and their associated metadata.

  - id: vecdb-embedding-inversion
    name: Embedding Inversion Attack
    description: |
      Adversary reconstructs approximate source text from stored vector
      embeddings, bypassing document-level access controls and exposing
      sensitive content that was assumed to be protected by the embedding
      transformation.

  - id: vecdb-cross-tenant-leakage
    name: Cross-Tenant Data Leakage in Vector Store
    description: |
      Embeddings from different tenants share a vector index without adequate
      isolation, allowing queries from one tenant to retrieve or be influenced
      by another tenant's data.

  # ============================================================================
  # Embedding Service Threats
  # ============================================================================
  - id: embed-model-substitution
    name: Embedding Model Substitution
    description: |
      Adversary replaces or tampers with the embedding model, causing it to
      produce biased, degraded, or adversarially crafted vector representations
      that undermine retrieval accuracy and safety.

  - id: embed-data-exfiltration
    name: Data Exfiltration via Embedding API
    description: |
      Sensitive documents sent to an external embedding service are exposed to
      the service provider or intercepted in transit, leaking confidential
      content outside the trust boundary.

  - id: embed-adversarial-perturbation
    name: Adversarial Embedding Perturbation
    description: |
      Attacker crafts input text that produces embedding vectors colliding with
      or proximate to target vectors, manipulating retrieval results without
      altering the indexed documents.

  # ============================================================================
  # Agent Orchestrator Threats
  # ============================================================================
  - id: agent-goal-hijack
    name: Agent Goal Hijacking
    description: |
      Adversary manipulates agent objectives through prompt injection, context
      poisoning, or crafted tool outputs, redirecting the agent to pursue
      attacker-chosen goals instead of the intended user task.

  - id: agent-privilege-escalation
    name: Agent Privilege Escalation
    description: |
      Agent acquires or inherits permissions beyond its intended scope through
      overly broad credentials, role confusion between agents, or exploitation
      of delegation chains, enabling unauthorized actions across connected systems.

  - id: agent-memory-poisoning
    name: Agent Memory and Context Poisoning
    description: |
      Adversary injects malicious content into an agent's persistent memory,
      conversation history, or shared context, influencing future decisions and
      actions across sessions or interactions.

  - id: agent-cascading-failure
    name: Cascading Failure in Agent Chains
    description: |
      A failure, hallucination, or compromise in one agent propagates through
      multi-agent workflows, amplifying errors across dependent agents and
      causing compounding damage to downstream systems.

  - id: agent-insecure-delegation
    name: Insecure Agent-to-Agent Delegation
    description: |
      Messages and task delegations between agents lack authentication, integrity
      verification, or authorization checks, allowing an attacker to inject tasks,
      impersonate agents, or intercept inter-agent communications.

  - id: agent-rogue-behavior
    name: Rogue Agent Behavior
    description: |
      Agent deviates from intended behavior due to misalignment, adversarial
      manipulation, or emergent goal-seeking, acting autonomously against
      organizational policies or user interests without adequate monitoring.

  - id: agent-human-trust-exploitation
    name: Human-Agent Trust Exploitation
    description: |
      Agent exploits human trust by presenting fabricated information as
      authoritative, bypassing human approval for high-impact actions, or
      gradually escalating its autonomy through repeated low-risk requests.

  - id: agent-excessive-autonomy
    name: Excessive Agent Autonomy
    description: |
      Agent is configured with insufficient human-in-the-loop controls for
      high-impact operations, allowing it to execute destructive or irreversible
      actions (data deletion, financial transactions, external communications)
      without human approval.

  # ============================================================================
  # Tool Executor Threats
  # ============================================================================
  - id: tool-misuse
    name: Tool Misuse via Malicious Parameters
    description: |
      Agent passes attacker-controlled or hallucinated parameters to tools,
      causing unintended operations such as accessing unauthorized data,
      modifying system state, or triggering destructive actions.

  - id: tool-injection
    name: Command Injection via Tool Execution
    description: |
      Untrusted input from LLM-generated tool calls is passed to system shells,
      databases, or APIs without sanitization, enabling command injection,
      SQL injection, or API abuse.

  - id: tool-rce
    name: Remote Code Execution via Tool Executor
    description: |
      Agent generates and executes arbitrary code through code interpreter tools
      or shell access without adequate sandboxing, enabling full system compromise
      on the host or connected infrastructure.

  - id: tool-excessive-permissions
    name: Tool Executor Over-Privileged Access
    description: |
      Tool execution environment runs with permissions exceeding what any
      individual tool requires, allowing a compromised tool call to access
      resources, networks, or data beyond its intended scope.

  # ============================================================================
  # MCP Server Threats
  # ============================================================================
  - id: mcp-tool-poisoning
    name: MCP Tool Poisoning
    description: |
      Compromised or malicious MCP tool definitions inject hidden instructions
      into tool descriptions, manipulating the LLM's behavior when it reads
      the tool schema during planning.

  - id: mcp-token-exposure
    name: MCP Token and Secret Exposure
    description: |
      Credentials, API keys, or tokens used by MCP server connections are exposed
      through model context, logs, error messages, or insufficient secret
      management, enabling unauthorized access to connected systems.

  - id: mcp-privilege-escalation
    name: MCP Privilege Escalation via Scope Creep
    description: |
      MCP server permissions gradually expand beyond original scope through
      dynamic tool registration, permissive capability negotiation, or
      insufficient authorization enforcement, granting agents unintended access.

  - id: mcp-supply-chain
    name: MCP Supply Chain Compromise
    description: |
      Malicious or compromised MCP server packages, plugins, or dependencies
      introduce backdoors, data exfiltration, or behavior modification into
      the agent tooling supply chain.

  - id: mcp-shadow-server
    name: Shadow MCP Server
    description: |
      Unapproved MCP servers deployed outside security governance operate with
      default credentials, permissive configurations, and no audit logging,
      creating unmonitored attack surfaces.

  - id: mcp-intent-subversion
    name: MCP Intent Flow Subversion
    description: |
      Malicious content in MCP tool responses or resource data redirects the
      agent's execution flow away from the user's intent toward attacker-chosen
      objectives.

  - id: mcp-context-oversharing
    name: MCP Context Injection and Over-Sharing
    description: |
      Shared context windows between MCP tools expose sensitive information
      across tasks, users, or security domains due to insufficient scoping
      and isolation of MCP resource access.

  - id: mcp-insufficient-auth
    name: MCP Insufficient Authentication and Authorization
    description: |
      MCP servers fail to verify client identity, enforce per-tool authorization,
      or validate request scopes, allowing unauthorized agents or users to invoke
      sensitive tools.

  # ============================================================================
  # Guardrail Threats
  # ============================================================================
  - id: guardrail-bypass
    name: Guardrail Bypass
    description: |
      Attacker crafts adversarial inputs that evade guardrail detection rules,
      allowing prompt injections, harmful content, or policy-violating requests
      to pass through to the LLM unfiltered.

  - id: guardrail-misconfiguration
    name: Guardrail Misconfiguration
    description: |
      Guardrail rules are overly permissive, outdated, or incorrectly configured,
      failing to catch known attack patterns or blocking legitimate use cases,
      reducing both security and usability.

  - id: guardrail-output-failure
    name: Output Guardrail Failure
    description: |
      Output-side guardrails fail to detect or filter harmful, biased, or
      policy-violating content in LLM responses before they reach end users
      or downstream systems.

  # ============================================================================
  # Training Pipeline Threats
  # ============================================================================
  - id: training-data-poisoning
    name: Training Data Poisoning
    description: |
      Adversary introduces malicious, biased, or backdoored samples into training
      data, causing the model to learn attacker-chosen behaviors that activate
      on specific triggers during inference.

  - id: training-supply-chain
    name: Training Supply Chain Compromise
    description: |
      Pre-trained models, datasets, or training frameworks sourced from external
      repositories contain backdoors, vulnerabilities, or malicious modifications
      that compromise the fine-tuning or training process.

  - id: training-data-leakage
    name: Sensitive Data in Training Corpus
    description: |
      PII, credentials, proprietary information, or copyrighted content included
      in training data becomes memorized by the model and can be extracted through
      targeted prompting during inference.

  - id: training-unauthorized-modification
    name: Unauthorized Training Pipeline Modification
    description: |
      Attacker gains access to the training pipeline and modifies training
      parameters, data preprocessing steps, or model architecture to introduce
      subtle behavioral changes that are difficult to detect in evaluation.

  # ============================================================================
  # Model Registry Threats
  # ============================================================================
  - id: registry-model-tampering
    name: Model Artifact Tampering
    description: |
      Attacker modifies stored model weights, configuration, or serialized
      artifacts in the registry, introducing backdoors or degraded behavior
      in subsequently deployed model versions.

  - id: registry-unauthorized-deployment
    name: Unauthorized Model Deployment
    description: |
      Insufficient access controls on the model registry allow unauthorized
      users to promote untested, unapproved, or malicious model versions
      to production.

  - id: registry-lineage-manipulation
    name: Model Lineage and Provenance Manipulation
    description: |
      Attacker manipulates model metadata, version history, or provenance
      records to disguise a tampered model as a legitimate approved version,
      bypassing governance controls.

  # ============================================================================
  # Document Store Threats
  # ============================================================================
  - id: docstore-knowledge-poisoning
    name: Knowledge Base Poisoning
    description: |
      Attacker injects malicious, misleading, or adversarial documents into the
      knowledge base, causing the RAG pipeline to retrieve and surface harmful
      content in LLM responses.

  - id: docstore-unauthorized-access
    name: Unauthorized Document Access
    description: |
      Insufficient access controls on the document store allow the RAG pipeline
      to retrieve and expose documents that the requesting user is not authorized
      to view, bypassing document-level permissions.

  - id: docstore-sensitive-data-exposure
    name: Sensitive Data Exposure in Source Documents
    description: |
      Source documents containing PII, credentials, or confidential information
      are ingested into the knowledge base without redaction, making them
      retrievable through semantic search queries.

  # ============================================================================
  # AI Gateway Threats
  # ============================================================================
  - id: gateway-rate-limit-bypass
    name: AI Gateway Rate Limit Bypass
    description: |
      Attacker circumvents gateway rate limiting through request splitting,
      identity rotation, or exploiting rate limit scope gaps, enabling
      resource exhaustion attacks against model endpoints.

  - id: gateway-auth-bypass
    name: AI Gateway Authentication Bypass
    description: |
      Authentication or authorization controls on the AI gateway are bypassed
      or misconfigured, allowing unauthorized users or services to access
      model endpoints directly.

  - id: gateway-logging-gap
    name: AI Gateway Monitoring Blind Spots
    description: |
      Insufficient logging granularity or monitoring coverage in the AI gateway
      fails to capture prompt content, model responses, or usage anomalies
      needed to detect abuse, data exfiltration, or policy violations.

  - id: gateway-model-routing-abuse
    name: Model Routing Manipulation
    description: |
      Attacker manipulates gateway routing logic to direct requests to
      unintended model versions, less restrictive model configurations,
      or model endpoints with weaker safety controls.

  # ============================================================================
  # Evaluation Harness Threats
  # ============================================================================
  - id: eval-false-confidence
    name: Evaluation False Confidence
    description: |
      Evaluation benchmarks or test suites are insufficiently adversarial,
      stale, or narrowly scoped, producing passing results for models that
      harbor vulnerabilities, biases, or safety failures undetected.

  - id: eval-data-contamination
    name: Evaluation Data Contamination
    description: |
      Test data leaks into training data or is shared across evaluation and
      training pipelines, producing artificially high evaluation scores that
      do not reflect real-world model behavior.

  - id: eval-tampering
    name: Evaluation Pipeline Tampering
    description: |
      Attacker modifies evaluation scripts, scoring functions, or benchmark
      datasets to produce fraudulent passing results for a compromised or
      underperforming model.
