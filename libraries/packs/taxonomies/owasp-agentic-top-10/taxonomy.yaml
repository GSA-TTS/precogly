taxonomies:
  - slug: owasp-agentic-top-10-2026
    name: OWASP Top 10 for Agentic Applications 2026
    description: "Top 10 risks for autonomous and agentic AI systems, published by the OWASP Agentic Security Initiative"
    source_url: "https://genai.owasp.org/agentic-security-initiative/"
    entries:
      - external_id: ASI01
        title: Agent Goal Hijack
        description: "Adversary manipulates an agent's objectives through prompt injection or context poisoning, redirecting the agent to serve attacker goals instead of user intent."
      - external_id: ASI02
        title: Tool Misuse and Exploitation
        description: "Agents invoke tools in unintended or harmful ways due to insufficient validation of tool parameters, missing authorization checks, or ambiguous tool definitions."
      - external_id: ASI03
        title: Identity and Privilege Abuse
        description: "Agents acquire or inherit permissions beyond what is needed, enabling privilege escalation across systems through overly broad credentials or role confusion."
      - external_id: ASI04
        title: Agentic Supply Chain Vulnerabilities
        description: "Compromised or untrusted plugins, tools, or sub-agents introduce malicious behavior into the agentic workflow through the supply chain."
      - external_id: ASI05
        title: Unexpected Code Execution (RCE)
        description: "Agents generate and execute code without adequate sandboxing, enabling remote code execution on host systems or connected infrastructure."
      - external_id: ASI06
        title: Memory and Context Poisoning
        description: "Adversary injects malicious content into an agent's persistent memory or conversation context to influence future decisions and actions."
      - external_id: ASI07
        title: Insecure Inter-Agent Communication
        description: "Messages exchanged between agents lack authentication, integrity checks, or confidentiality protections, enabling interception and manipulation."
      - external_id: ASI08
        title: Cascading Failures
        description: "A failure or compromise in one agent propagates through multi-agent systems, amplifying impact across dependent agents and downstream systems."
      - external_id: ASI09
        title: Human-Agent Trust Exploitation
        description: "Agents exploit or erode human trust by presenting fabricated information as authoritative or by bypassing human approval for high-impact actions."
      - external_id: ASI10
        title: Rogue Agents
        description: "Agents deviate from intended behavior due to misalignment, adversarial manipulation, or emergent goal-seeking, acting autonomously against organizational interests."
