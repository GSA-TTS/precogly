taxonomies:
  - slug: owasp-llm-top-10-2025
    name: OWASP Top 10 for LLM Applications 2025
    description: "Top 10 risks for Large Language Model applications, published by the OWASP GenAI Security Project"
    source_url: "https://genai.owasp.org/llm-top-10/"
    entries:
      - external_id: "LLM01:2025"
        title: Prompt Injection
        description: "Malicious input manipulates LLM behavior, causing the model to ignore system instructions or execute unintended actions."
        reference_url: "https://genai.owasp.org/llmrisk/llm01-prompt-injection/"
      - external_id: "LLM02:2025"
        title: Sensitive Information Disclosure
        description: "Unprotected sensitive data leaks from LLM systems and their applications, compromising confidentiality."
        reference_url: "https://genai.owasp.org/llmrisk/llm02-sensitive-information-disclosure/"
      - external_id: "LLM03:2025"
        title: Supply Chain
        description: "Vulnerabilities in LLM supply chains, from dependencies to model sourcing, create exploitable security gaps."
        reference_url: "https://genai.owasp.org/llmrisk/llm03-supply-chain/"
      - external_id: "LLM04:2025"
        title: Data and Model Poisoning
        description: "Training or embedding data contamination causes models to produce unreliable, biased, or harmful outputs."
        reference_url: "https://genai.owasp.org/llmrisk/llm04-data-and-model-poisoning/"
      - external_id: "LLM05:2025"
        title: Improper Output Handling
        description: "Insufficient validation and sanitization of LLM outputs enables downstream security vulnerabilities such as XSS or injection."
        reference_url: "https://genai.owasp.org/llmrisk/llm05-improper-output-handling/"
      - external_id: "LLM06:2025"
        title: Excessive Agency
        description: "Granting LLM systems excessive autonomous capabilities or permissions increases the risk of unintended harmful actions."
        reference_url: "https://genai.owasp.org/llmrisk/llm06-excessive-agency/"
      - external_id: "LLM07:2025"
        title: System Prompt Leakage
        description: "Exposure of system prompts reveals model instructions, constraints, and internal configuration to potential attackers."
        reference_url: "https://genai.owasp.org/llmrisk/llm07-system-prompt-leakage/"
      - external_id: "LLM08:2025"
        title: Vector and Embedding Weaknesses
        description: "Vulnerabilities in vector storage and embedding pipelines create attack vectors in RAG and similar retrieval-augmented systems."
        reference_url: "https://genai.owasp.org/llmrisk/llm08-vector-and-embedding-weaknesses/"
      - external_id: "LLM09:2025"
        title: Misinformation
        description: "LLMs generate false or misleading information that can deceive users and undermine application reliability."
        reference_url: "https://genai.owasp.org/llmrisk/llm09-misinformation/"
      - external_id: "LLM10:2025"
        title: Unbounded Consumption
        description: "Uncontrolled resource usage by LLM processes leads to excessive costs, denial of service, or service degradation."
        reference_url: "https://genai.owasp.org/llmrisk/llm10-unbounded-consumption/"
