taxonomies:
  - slug: owasp-mcp-top-10-2025
    name: OWASP MCP Top 10 2025
    description: "Top 10 risks for Model Context Protocol implementations, published by the OWASP MCP Top 10 Project"
    source_url: "https://owasp.org/www-project-mcp-top-10/"
    entries:
      - external_id: "MCP01:2025"
        title: Token Mismanagement and Secret Exposure
        description: "Exposed credentials and tokens stored in model memory enable attackers to gain unauthorized access to connected systems."
        reference_url: "https://owasp.github.io/www-project-mcp-top-10/docs/MCP01_2025-Token_Mismanagement_and_Secret_Exposure"
      - external_id: "MCP02:2025"
        title: Privilege Escalation via Scope Creep
        description: "Loosely defined permissions gradually expand, allowing agents to perform unintended actions beyond their original scope."
        reference_url: "https://owasp.github.io/www-project-mcp-top-10/docs/MCP02_2025-Privilege_Escalation_via_Scope_Creep"
      - external_id: "MCP03:2025"
        title: Tool Poisoning
        description: "Compromised tools inject malicious or misleading data to manipulate AI model behavior and decision-making."
        reference_url: "https://owasp.github.io/www-project-mcp-top-10/docs/MCP03_2025-Tool_Poisoning"
      - external_id: "MCP04:2025"
        title: Software Supply Chain Attacks and Dependency Tampering
        description: "Malicious dependencies in MCP ecosystems introduce backdoors and alter agent behavior at the execution level."
        reference_url: "https://owasp.github.io/www-project-mcp-top-10/docs/MCP04_2025-Software_Supply_Chain_Attacks_and_Dependency_Tampering"
      - external_id: "MCP05:2025"
        title: Command Injection and Execution
        description: "AI agents construct and execute system commands using untrusted input without proper validation or sanitization."
        reference_url: "https://owasp.github.io/www-project-mcp-top-10/docs/MCP05_2025-Command_Injection_and_Execution"
      - external_id: "MCP06:2025"
        title: Intent Flow Subversion
        description: "Malicious instructions embedded in retrieved context redirect agents away from legitimate user objectives toward attacker goals."
        reference_url: "https://owasp.github.io/www-project-mcp-top-10/docs/MCP06_2025-Intent_Flow_Subversion"
      - external_id: "MCP07:2025"
        title: Insufficient Authentication and Authorization
        description: "MCP servers and tools fail to verify identities or enforce access controls, exposing critical attack paths in multi-agent ecosystems."
        reference_url: "https://owasp.github.io/www-project-mcp-top-10/docs/MCP07_2025-Insufficient_Authentication_and_Authorization"
      - external_id: "MCP08:2025"
        title: Lack of Audit and Telemetry
        description: "Limited activity logging prevents detection of unauthorized actions and hinders investigation and incident response capabilities."
        reference_url: "https://owasp.github.io/www-project-mcp-top-10/docs/MCP08_2025-Lack_of_Audit_and_Telemetry"
      - external_id: "MCP09:2025"
        title: Shadow MCP Servers
        description: "Unapproved MCP deployments operating outside security governance use default credentials and permissive configurations."
        reference_url: "https://owasp.github.io/www-project-mcp-top-10/docs/MCP09_2025-Shadow_MCP_Servers"
      - external_id: "MCP10:2025"
        title: Context Injection and Over-Sharing
        description: "Shared context windows expose sensitive information across tasks, users, and agents due to insufficient scoping and isolation."
        reference_url: "https://owasp.github.io/www-project-mcp-top-10/docs/MCP10_2025-Context_Injection_and_Over-Sharing"
