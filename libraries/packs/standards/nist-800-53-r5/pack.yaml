  - section_code: AC-1
    name: Policy and Procedures
    description: 'Develop, document, and disseminate to {{ insert: param, ac-1_prm_1 }}:

      {{ insert: param, ac-01_odp.03 }} access control policy that:

      Addresses purpose, scope, roles, responsibilities, management commitment, coordination among organizational
      entities, and compliance; and

      Is consistent with applicable laws, executive orders, directives, regulations, policies, standards,
      and guidelines; and

      Procedures to facilitate the implementation of the access control policy and the associated access
      controls;

      Designate an {{ insert: param, ac-01_odp.04 }} to manage the development, documentation, and dissemination
      of the access control policy and procedures; and

      Review and update the current access control:

      Policy {{ insert: param, ac-01_odp.05 }} and following {{ insert: param, ac-01_odp.06 }} ; and

      Procedures {{ insert: param, ac-01_odp.07 }} and following {{ insert: param, ac-01_odp.08 }}.'
    requirement_type: control
    format_metadata:
      oscal_id: ac-1
      family: AC
      source: NIST OSCAL
      parameters:
      - ac-1_prm_1
