  - section_code: SA-17
    name: Developer Security and Privacy Architecture and Design
    description: 'Require the developer of the system, system component, or system service to produce
      a design specification and security and privacy architecture that:

      Is consistent with the organization’s security and privacy architecture that is an integral part
      the organization’s enterprise architecture;

      Accurately and completely describes the required security and privacy functionality, and the allocation
      of controls among physical and logical components; and

      Expresses how individual security and privacy functions, mechanisms, and services work together
      to provide required security and privacy capabilities and a unified approach to protection.'
    requirement_type: control
    format_metadata:
      oscal_id: sa-17
      family: SA
      source: NIST OSCAL
      parameters: []
      disposition_links: []
  - section_code: SA-17(1)
    name: Formal Policy Model
    description: 'Require the developer of the system, system component, or system service to:

      Produce, as an integral part of the development process, a formal policy model describing the {{
      insert: param, sa-17.1_prm_1 }} to be enforced; and

      Prove that the formal policy model is internally consistent and sufficient to enforce the defined
      elements of the organizational security and privacy policy when implemented.'
    requirement_type: enhancement
    format_metadata:
      oscal_id: sa-17.1
      family: SA
      source: NIST OSCAL
      parameters:
      - sa-17.1_prm_1
      - sa-17.01_odp.01
      - sa-17.01_odp.02
      disposition_links: []
    parent: SA-17
  - section_code: SA-17(2)
    name: Security-relevant Components
    description: 'Require the developer of the system, system component, or system service to:

      Define security-relevant hardware, software, and firmware; and

      Provide a rationale that the definition for security-relevant hardware, software, and firmware is
      complete.'
    requirement_type: enhancement
    format_metadata:
      oscal_id: sa-17.2
      family: SA
      source: NIST OSCAL
      parameters: []
      disposition_links: []
    parent: SA-17
  - section_code: SA-17(3)
    name: Formal Correspondence
    description: 'Require the developer of the system, system component, or system service to:

      Produce, as an integral part of the development process, a formal top-level specification that specifies
      the interfaces to security-relevant hardware, software, and firmware in terms of exceptions, error
      messages, and effects;

      Show via proof to the extent feasible with additional informal demonstration as necessary, that
      the formal top-level specification is consistent with the formal policy model;

      Show via informal demonstration, that the formal top-level specification completely covers the interfaces
      to security-relevant hardware, software, and firmware;

      Show that the formal top-level specification is an accurate description of the implemented security-relevant
      hardware, software, and firmware; and

      Describe the security-relevant hardware, software, and firmware mechanisms not addressed in the
      formal top-level specification but strictly internal to the security-relevant hardware, software,
      and firmware.'
    requirement_type: enhancement
    format_metadata:
      oscal_id: sa-17.3
      family: SA
      source: NIST OSCAL
      parameters: []
      disposition_links: []
    parent: SA-17
  - section_code: SA-17(4)
    name: Informal Correspondence
    description: 'Require the developer of the system, system component, or system service to:

      Produce, as an integral part of the development process, an informal descriptive top-level specification
      that specifies the interfaces to security-relevant hardware, software, and firmware in terms of
      exceptions, error messages, and effects;

      Show via {{ insert: param, sa-17.04_odp }} that the descriptive top-level specification is consistent
      with the formal policy model;

      Show via informal demonstration, that the descriptive top-level specification completely covers
      the interfaces to security-relevant hardware, software, and firmware;

      Show that the descriptive top-level specification is an accurate description of the interfaces to
      security-relevant hardware, software, and firmware; and

      Describe the security-relevant hardware, software, and firmware mechanisms not addressed in the
      descriptive top-level specification but strictly internal to the security-relevant hardware, software,
      and firmware.'
    requirement_type: enhancement
    format_metadata:
      oscal_id: sa-17.4
      family: SA
      source: NIST OSCAL
      parameters:
      - sa-17.04_odp
      disposition_links: []
    parent: SA-17
  - section_code: SA-17(5)
    name: Conceptually Simple Design
    description: 'Require the developer of the system, system component, or system service to:

      Design and structure the security-relevant hardware, software, and firmware to use a complete, conceptually
      simple protection mechanism with precisely defined semantics; and

      Internally structure the security-relevant hardware, software, and firmware with specific regard
      for this mechanism.'
    requirement_type: enhancement
    format_metadata:
      oscal_id: sa-17.5
      family: SA
      source: NIST OSCAL
      parameters: []
      disposition_links: []
    parent: SA-17
