    name: System Development Life Cycle
    description: 'Acquire, develop, and manage the system using {{ insert: param, sa-03_odp }} that incorporates
      information security and privacy considerations;

      Define and document information security and privacy roles and responsibilities throughout the system
      development life cycle;

      Identify individuals having information security and privacy roles and responsibilities; and

      Integrate the organizational information security and privacy risk management process into system
      development life cycle activities.'
    requirement_type: control
