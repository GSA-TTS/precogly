  - section_code: MA-1
    name: Policy and Procedures
    description: 'Develop, document, and disseminate to {{ insert: param, ma-1_prm_1 }}:

      {{ insert: param, ma-01_odp.03 }} maintenance policy that:

      Addresses purpose, scope, roles, responsibilities, management commitment, coordination among organizational
      entities, and compliance; and

      Is consistent with applicable laws, executive orders, directives, regulations, policies, standards,
      and guidelines; and

      Procedures to facilitate the implementation of the maintenance policy and the associated maintenance
      controls;

      Designate an {{ insert: param, ma-01_odp.04 }} to manage the development, documentation, and dissemination
      of the maintenance policy and procedures; and

      Review and update the current maintenance:

      Policy {{ insert: param, ma-01_odp.05 }} and following {{ insert: param, ma-01_odp.06 }} ; and

      Procedures {{ insert: param, ma-01_odp.07 }} and following {{ insert: param, ma-01_odp.08 }}.'
