  - section_code: SA-4(6)
    name: Use of Information Assurance Products
    description: 'Employ only government off-the-shelf or commercial off-the-shelf information assurance
      and information assurance-enabled information technology products that compose an NSA-approved solution
      to protect classified information when the networks used to transmit the information are at a lower
      classification level than the information being transmitted; and

      Ensure that these products have been evaluated and/or validated by NSA or in accordance with NSA-approved
      procedures.'
    requirement_type: enhancement
    format_metadata:
      oscal_id: sa-4.6
      family: SA
      source: NIST OSCAL
      parameters: []
      disposition_links: []
    parent: SA-4
  - section_code: SA-4(7)
    name: 'NIAP-approved Protection Profiles '
    description: 'Limit the use of commercially provided information assurance and information assurance-enabled
      information technology products to those products that have been successfully evaluated against
      a National Information Assurance partnership (NIAP)-approved Protection Profile for a specific technology
      type, if such a profile exists; and

      Require, if no NIAP-approved Protection Profile exists for a specific technology type but a commercially
      provided information technology product relies on cryptographic functionality to enforce its security
      policy, that the cryptographic module is FIPS-validated or NSA-approved.'
    requirement_type: enhancement
    format_metadata:
