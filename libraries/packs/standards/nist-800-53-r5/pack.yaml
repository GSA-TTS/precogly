      matching program:

      Obtain approval from the Data Integrity Board to conduct the matching program;

      Develop and enter into a computer matching agreement;

      Publish a matching notice in the Federal Register;

      Independently verify the information produced by the matching program before taking adverse action
      against an individual, if required; and

      Provide individuals with notice and an opportunity to contest the findings before taking adverse
