    name: Logging and Review
    description: 'Log {{ insert: param, ma-4.1_prm_1 }} for nonlocal maintenance and diagnostic sessions;
      and

      Review the audit records of the maintenance and diagnostic sessions to detect anomalous behavior.'
    requirement_type: enhancement
    format_metadata:
      oscal_id: ma-4.1
      family: MA
      source: NIST OSCAL
      parameters:
