  - section_code: MA-5
    name: Maintenance Personnel
    description: 'Establish a process for maintenance personnel authorization and maintain a list of authorized
      maintenance organizations or personnel;

      Verify that non-escorted personnel performing maintenance on the system possess the required access
      authorizations; and

      Designate organizational personnel with required access authorizations and technical competence
      to supervise the maintenance activities of personnel who do not possess the required access authorizations.'
    requirement_type: control
    format_metadata:
      oscal_id: ma-5
      family: MA
      source: NIST OSCAL
      parameters: []
      disposition_links: []
  - section_code: MA-5(1)
    name: Individuals Without Appropriate Access
    description: 'Implement procedures for the use of maintenance personnel that lack appropriate security
      clearances or are not U.S. citizens, that include the following requirements:

      Maintenance personnel who do not have needed access authorizations, clearances, or formal access
      approvals are escorted and supervised during the performance of maintenance and diagnostic activities
      on the system by approved organizational personnel who are fully cleared, have appropriate access
      authorizations, and are technically qualified; and

      Prior to initiating maintenance or diagnostic activities by personnel who do not have needed access
      authorizations, clearances or formal access approvals, all volatile information storage components
      within the system are sanitized and all nonvolatile storage media are removed or physically disconnected
      from the system and secured; and

      Develop and implement {{ insert: param, ma-05.01_odp }} in the event a system component cannot be
      sanitized, removed, or disconnected from the system.'
    requirement_type: enhancement
    format_metadata:
      oscal_id: ma-5.1
      family: MA
      source: NIST OSCAL
      parameters:
