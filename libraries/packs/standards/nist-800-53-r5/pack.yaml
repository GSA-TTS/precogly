  - section_code: PT-7(1)
    name: Social Security Numbers
    description: 'When a system processes Social Security numbers:

      Eliminate unnecessary collection, maintenance, and use of Social Security numbers, and explore alternatives
      to their use as a personal identifier;

      Do not deny any individual any right, benefit, or privilege provided by law because of such individual’s
      refusal to disclose his or her Social Security number; and

      Inform any individual who is asked to disclose his or her Social Security number whether that disclosure
      is mandatory or voluntary, by what statutory or other authority such number is solicited, and what
      uses will be made of it.'
    requirement_type: enhancement
    format_metadata:
      oscal_id: pt-7.1
      family: PT
      source: NIST OSCAL
      parameters: []
      disposition_links: []
    parent: PT-7
  - section_code: PT-7(2)
