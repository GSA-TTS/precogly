      source: NIST OSCAL
      parameters: []
      disposition_links: []
    parent: MA-3
  - section_code: MA-3(3)
    name: Prevent Unauthorized Removal
    description: 'Prevent the removal of maintenance equipment containing organizational information by:

      Verifying that there is no organizational information contained on the equipment;

      Sanitizing or destroying the equipment;

      Retaining the equipment within the facility; or

      Obtaining an exemption from {{ insert: param, ma-03.03_odp }} explicitly authorizing removal of
      the equipment from the facility.'
    requirement_type: enhancement
    format_metadata:
