  - section_code: IR-8
    name: Incident Response Plan
    description: 'Develop an incident response plan that:

      Provides the organization with a roadmap for implementing its incident response capability;

      Describes the structure and organization of the incident response capability;

      Provides a high-level approach for how the incident response capability fits into the overall organization;

      Meets the unique requirements of the organization, which relate to mission, size, structure, and
      functions;

      Defines reportable incidents;

      Provides metrics for measuring the incident response capability within the organization;

      Defines the resources and management support needed to effectively maintain and mature an incident
      response capability;

      Addresses the sharing of incident information;

      Is reviewed and approved by {{ insert: param, ir-08_odp.01 }} {{ insert: param, ir-08_odp.02 }}
      ; and

      Explicitly designates responsibility for incident response to {{ insert: param, ir-08_odp.03 }}.

      Distribute copies of the incident response plan to {{ insert: param, ir-08_odp.04 }};

      Update the incident response plan to address system and organizational changes or problems encountered
      during plan implementation, execution, or testing;

      Communicate incident response plan changes to {{ insert: param, ir-8_prm_5 }} ; and

      Protect the incident response plan from unauthorized disclosure and modification.'
    requirement_type: control
    format_metadata:
      oscal_id: ir-8
      family: IR
      source: NIST OSCAL
      parameters:
      - ir-8_prm_5
      - ir-08_odp.01
      - ir-08_odp.02
      - ir-08_odp.03
      - ir-08_odp.04
      - ir-08_odp.05
      - ir-08_odp.06
      - ir-08_odp.07
      disposition_links: []
  - section_code: IR-8(1)
    name: Breaches
    description: 'Include the following in the Incident Response Plan for breaches involving personally
      identifiable information:

      A process to determine if notice to individuals or other organizations, including oversight organizations,
      is needed;

      An assessment process to determine the extent of the harm, embarrassment, inconvenience, or unfairness
      to affected individuals and any mechanisms to mitigate such harms; and

      Identification of applicable privacy requirements.'
    requirement_type: enhancement
    format_metadata:
      oscal_id: ir-8.1
      family: IR
      source: NIST OSCAL
      parameters: []
      disposition_links: []
    parent: IR-8
  - section_code: IR-9
    name: Information Spillage Response
    description: 'Respond to information spills by:

      Assigning {{ insert: param, ir-09_odp.01 }} with responsibility for responding to information spills;

      Identifying the specific information involved in the system contamination;

      Alerting {{ insert: param, ir-09_odp.02 }} of the information spill using a method of communication
      not associated with the spill;

      Isolating the contaminated system or system component;

      Eradicating the information from the contaminated system or component;

      Identifying other systems or system components that may have been subsequently contaminated; and

      Performing the following additional actions: {{ insert: param, ir-09_odp.03 }}.'
    requirement_type: control
    format_metadata:
      oscal_id: ir-9
      family: IR
      source: NIST OSCAL
      parameters:
      - ir-09_odp.01
      - ir-09_odp.02
      - ir-09_odp.03
      disposition_links: []
