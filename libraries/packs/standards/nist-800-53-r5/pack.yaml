  - section_code: IR-9(3)
    name: Post-spill Operations
    description: 'Implement the following procedures to ensure that organizational personnel impacted
      by information spills can continue to carry out assigned tasks while contaminated systems are undergoing
      corrective actions: {{ insert: param, ir-09.03_odp }}.'
