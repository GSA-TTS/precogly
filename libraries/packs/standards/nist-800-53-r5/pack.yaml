  - section_code: MA-5(2)
    name: Security Clearances for Classified Systems
    description: Verify that personnel performing maintenance and diagnostic activities on a system processing,
      storing, or transmitting classified information possess security clearances and formal access approvals
      for at least the highest classification level and for compartments of information on the system.
    requirement_type: enhancement
    format_metadata:
