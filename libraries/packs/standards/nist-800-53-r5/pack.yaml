  - section_code: SA-5
    name: System Documentation
    description: 'Obtain or develop administrator documentation for the system, system component, or system
      service that describes:

      Secure configuration, installation, and operation of the system, component, or service;

      Effective use and maintenance of security and privacy functions and mechanisms; and

      Known vulnerabilities regarding configuration and use of administrative or privileged functions;

      Obtain or develop user documentation for the system, system component, or system service that describes:

      User-accessible security and privacy functions and mechanisms and how to effectively use those functions
      and mechanisms;

      Methods for user interaction, which enables individuals to use the system, component, or service
      in a more secure manner and protect individual privacy; and

      User responsibilities in maintaining the security of the system, component, or service and privacy
      of individuals;

      Document attempts to obtain system, system component, or system service documentation when such
      documentation is either unavailable or nonexistent and take {{ insert: param, sa-05_odp.01 }} in
      response; and

      Distribute documentation to {{ insert: param, sa-05_odp.02 }}.'
