  - section_code: MA-4(3)
    name: Comparable Security and Sanitization
    description: 'Require that nonlocal maintenance and diagnostic services be performed from a system
      that implements a security capability comparable to the capability implemented on the system being
      serviced; or

      Remove the component to be serviced from the system prior to nonlocal maintenance or diagnostic
      services; sanitize the component (for organizational information); and after the service is performed,
      inspect and sanitize the component (for potentially malicious software) before reconnecting the
      component to the system.'
    requirement_type: enhancement
    format_metadata:
      oscal_id: ma-4.3
      family: MA
      source: NIST OSCAL
      parameters: []
      disposition_links: []
    parent: MA-4
  - section_code: MA-4(4)
    name: Authentication and Separation of Maintenance Sessions
    description: 'Protect nonlocal maintenance sessions by:

      Employing {{ insert: param, ma-04.04_odp }} ; and

      Separating the maintenance sessions from other network sessions with the system by either:

      Physically separated communications paths; or

      Logically separated communications paths.'
    requirement_type: enhancement
    format_metadata:
      oscal_id: ma-4.4
      family: MA
      source: NIST OSCAL
      parameters:
