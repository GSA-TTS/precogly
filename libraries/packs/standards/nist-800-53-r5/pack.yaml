    description: 'Include the following requirements, descriptions, and criteria, explicitly or by reference,
      using {{ insert: param, sa-04_odp.01 }} in the acquisition contract for the system, system component,
      or system service:

      Security and privacy functional requirements;

      Strength of mechanism requirements;

      Security and privacy assurance requirements;

      Controls needed to satisfy the security and privacy requirements.

      Security and privacy documentation requirements;

      Requirements for protecting security and privacy documentation;

      Description of the system development environment and environment in which the system is intended
      to operate;

      Allocation of responsibility or identification of parties responsible for information security,
      privacy, and supply chain risk management; and

      Acceptance criteria.'
