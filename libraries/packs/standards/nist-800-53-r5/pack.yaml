  - section_code: CP-2
    name: Contingency Plan
    description: 'Develop a contingency plan for the system that:

      Identifies essential mission and business functions and associated contingency requirements;

      Provides recovery objectives, restoration priorities, and metrics;

      Addresses contingency roles, responsibilities, assigned individuals with contact information;

      Addresses maintaining essential mission and business functions despite a system disruption, compromise,
      or failure;

      Addresses eventual, full system restoration without deterioration of the controls originally planned
      and implemented;

      Addresses the sharing of contingency information; and

      Is reviewed and approved by {{ insert: param, cp-2_prm_1 }};

      Distribute copies of the contingency plan to {{ insert: param, cp-2_prm_2 }};

      Coordinate contingency planning activities with incident handling activities;

      Review the contingency plan for the system {{ insert: param, cp-02_odp.05 }};

      Update the contingency plan to address changes to the organization, system, or environment of operation
      and problems encountered during contingency plan implementation, execution, or testing;

      Communicate contingency plan changes to {{ insert: param, cp-2_prm_4 }};

      Incorporate lessons learned from contingency plan testing, training, or actual contingency activities
      into contingency testing and training; and

      Protect the contingency plan from unauthorized disclosure and modification.'
    requirement_type: control
    format_metadata:
      oscal_id: cp-2
      family: CP
      source: NIST OSCAL
      parameters:
      - cp-2_prm_1
