  - section_code: PL-2
    name: System Security and Privacy Plans
    description: 'Develop security and privacy plans for the system that:

      Are consistent with the organization’s enterprise architecture;

      Explicitly define the constituent system components;

      Describe the operational context of the system in terms of mission and business processes;

      Identify the individuals that fulfill system roles and responsibilities;

      Identify the information types processed, stored, and transmitted by the system;

      Provide the security categorization of the system, including supporting rationale;

      Describe any specific threats to the system that are of concern to the organization;

      Provide the results of a privacy risk assessment for systems processing personally identifiable
      information;

      Describe the operational environment for the system and any dependencies on or connections to other
      systems or system components;

      Provide an overview of the security and privacy requirements for the system;

      Identify any relevant control baselines or overlays, if applicable;

      Describe the controls in place or planned for meeting the security and privacy requirements, including
      a rationale for any tailoring decisions;

      Include risk determinations for security and privacy architecture and design decisions;

      Include security- and privacy-related activities affecting the system that require planning and
      coordination with {{ insert: param, pl-02_odp.01 }} ; and

      Are reviewed and approved by the authorizing official or designated representative prior to plan
      implementation.

      Distribute copies of the plans and communicate subsequent changes to the plans to {{ insert: param,
      pl-02_odp.02 }};

      Review the plans {{ insert: param, pl-02_odp.03 }};

      Update the plans to address changes to the system and environment of operation or problems identified
      during plan implementation or control assessments; and

      Protect the plans from unauthorized disclosure and modification.'
    requirement_type: control
    format_metadata:
