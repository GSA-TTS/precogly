    description: 'Ensure that:

      Foreign nationals with appropriate security clearances are used to conduct maintenance and diagnostic
      activities on classified systems only when the systems are jointly owned and operated by the United
      States and foreign allied governments, or owned and operated solely by foreign allied governments;
      and

      Approvals, consents, and detailed operational conditions regarding the use of foreign nationals
      to conduct maintenance and diagnostic activities on classified systems are fully documented within
      Memoranda of Agreements.'
    requirement_type: enhancement
    format_metadata:
      oscal_id: ma-5.4
      family: MA
      source: NIST OSCAL
      parameters: []
      disposition_links: []
    parent: MA-5
