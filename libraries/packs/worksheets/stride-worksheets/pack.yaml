pack:
  schema_version: 1
  slug: stride-worksheets
  name: STRIDE Worksheets
  version: 1.0.0
  pack_type: template
  description: |
    Workshop worksheets as canvas tables, for facilitating a threat modeling
    session rather than describing a system.

    These carry no components, threats or countermeasures. A worksheet is a
    method, not a technology domain, so it has nothing to contribute to the
    suggestion engine and nothing to join against a taxonomy. That is why this
    pack is `template` rather than `full`: it is complete as it stands, not an
    unfinished technology pack.
  author: Precogly
  tags:
    - stride
    - workshop
    - worksheet
    - methodology
    - facilitation
