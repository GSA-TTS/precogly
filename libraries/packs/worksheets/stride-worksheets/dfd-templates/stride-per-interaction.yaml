template:
  slug: stride-per-interaction
  name: "STRIDE per Interaction"
  description: >-
    A workshop grid for one interaction: two elements and the flow between them,
    with a row per STRIDE category and a Mitigations / Weaknesses pair per
    element. Cells greyed out are the categories that do not apply to that
    element's type.
  category: worksheet
  diagram_type: level1

# A single table node. It annotates the canvas and carries no DFD semantics, so
# it contributes nothing to threat analysis — the worksheet is what the room
# fills in, and the findings are recorded as threats afterwards.
#
# Column groups, left to right: an external entity, the data flow between them,
# and a process. Rename the group headers to the real components; the greys are
# keyed to those three types, so reassigning a group to a different type means
# re-greying its column pair.
#
# The greys are Vikram's heuristic from precogly/precogly#520, which is classic
# STRIDE-per-element. Categories that do not apply:
#
#   External Entity   T, I, D, E
#   Process           (none)
#   Data Store        S, E
#   Data Flow         S, R, E
#
# Grey therefore *means* "not applicable here" in this worksheet, which is why
# the header rows are yellow rather than grey — a grey header would read as a
# column that had been ruled out.
canvas_data:
  nodes:
    - id: "table-stride-per-interaction"
      type: "table"
      position: { x: 120, y: 120 }
      data:
        label: "STRIDE per Interaction"
        headerRow: true
        # Wider first column: "Information Disclosure" is the longest label and
        # wraps into two lines below about 150.
        columnWidths: [150, 130, 130, 130, 130, 130, 130]
        rows:
          - height: 34
            cells:
              - { text: "STRIDE", rowSpan: 2, fill: yellow }
              - { text: "External Entity", colSpan: 2, fill: yellow }
              - { text: "" }
              - { text: "Data Flow  <——>", colSpan: 2, fill: yellow }
              - { text: "" }
              - { text: "Process", colSpan: 2, fill: yellow }
              - { text: "" }
          - height: 30
            cells:
              - { text: "" }
              - { text: "Mitigations", fill: yellow }
              - { text: "Weaknesses", fill: yellow }
              - { text: "Mitigations", fill: yellow }
              - { text: "Weaknesses", fill: yellow }
              - { text: "Mitigations", fill: yellow }
              - { text: "Weaknesses", fill: yellow }

          # One row per category. A row holds every threat the room finds for
          # that cell, rather than being duplicated per threat.
          - height: 44
            cells:
              - { text: "Spoofing" }
              - { text: "" }
              - { text: "" }
              - { text: "", fill: gray }
              - { text: "", fill: gray }
              - { text: "" }
              - { text: "" }
          - height: 44
            cells:
              - { text: "Tampering" }
              - { text: "", fill: gray }
              - { text: "", fill: gray }
              - { text: "" }
              - { text: "" }
              - { text: "" }
              - { text: "" }
          - height: 44
            cells:
              - { text: "Repudiation" }
              - { text: "" }
              - { text: "" }
              - { text: "", fill: gray }
              - { text: "", fill: gray }
              - { text: "" }
              - { text: "" }
          - height: 44
            cells:
              - { text: "Information Disclosure" }
              - { text: "", fill: gray }
              - { text: "", fill: gray }
              - { text: "" }
              - { text: "" }
              - { text: "" }
              - { text: "" }
          - height: 44
            cells:
              - { text: "Denial of Service" }
              - { text: "", fill: gray }
              - { text: "", fill: gray }
              - { text: "" }
              - { text: "" }
              - { text: "" }
              - { text: "" }
          - height: 44
            cells:
              - { text: "Elevation of Privilege" }
              - { text: "", fill: gray }
              - { text: "", fill: gray }
              - { text: "", fill: gray }
              - { text: "", fill: gray }
              - { text: "" }
              - { text: "" }
  edges: []
